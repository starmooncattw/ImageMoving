// 粒子系統核心函式

// 調整 Canvas 尺寸
function resizeParticleCanvas() {
    const container = document.getElementById('animationContainer');
    particleCanvas.width = container.offsetWidth;
    particleCanvas.height = container.offsetHeight;
}

// 初始化粒子
function initParticles() {
    particles = [];
    const type = document.getElementById('particleType').value;
    const count = type === 'sparkle' ? 30 : (type === 'confetti' ? 150 : 15);
    const useGrid = ['heart', 'star', 'sparkle'].includes(type);

    if (useGrid) {
        // 固定位置粒子使用網格分布
        const cols = Math.ceil(Math.sqrt(count * (particleCanvas.width / particleCanvas.height)));
        const rows = Math.ceil(count / cols);
        const cellW = particleCanvas.width / cols;
        const cellH = particleCanvas.height / rows;

        let idx = 0;
        for(let row = 0; row < rows && idx < count; row++) {
            for(let col = 0; col < cols && idx < count; col++) {
                const offsetX = (Math.random() - 0.5) * cellW * 0.6;
                const offsetY = (Math.random() - 0.5) * cellH * 0.6;

                particles.push({
                    startX: col * cellW + cellW / 2 + offsetX,
                    startY: row * cellH + cellH / 2 + offsetY,
                    s: Math.random()*0.5+0.6,
                    v: Math.random()*2+1,
                    o: Math.random()*Math.PI*2,
                    vx: (Math.random()-0.5)*2,
                    rotSpeed: (Math.random()-0.5)*5,
                    color: `hsl(${Math.random()*360}, 70%, 60%)`,
                    offset: Math.random() * 1000
                });
                idx++;
            }
        }
    } else {
        // 移動粒子使用隨機分布
        for(let i=0; i<count; i++) {
            particles.push({
                startX: Math.random()*particleCanvas.width,
                startY: Math.random()*particleCanvas.height,
                s: Math.random()*0.5+0.5,
                v: Math.random()*2+1,
                o: Math.random()*Math.PI*2,
                vx: (Math.random()-0.5)*2,
                rotSpeed: (Math.random()-0.5)*5,
                color: `hsl(${Math.random()*360}, 70%, 60%)`,
                offset: Math.random() * 1000
            });
        }
    }
}

// 繪製粒子
function drawParticles(currentTime) {
    const type = document.getElementById('particleType').value;
    const speed = parseFloat(document.getElementById('particleSpeed').value);

    particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    particleCtx.save();

    particles.forEach(p => {
        const t = (currentTime * speed * 100) + p.offset;
        let x, y, rot;

        const cycleHeight = particleCanvas.height + 60;
        const cycleWidth = particleCanvas.width + 60;

        // 計算粒子位置
        if (type === 'bubble') {
            const movement = (t * p.v * 0.5) % cycleHeight;
            y = (p.startY - movement + cycleHeight) % cycleHeight - 30;
            x = p.startX + Math.sin(t * 0.05 + p.o) * 30;
            x = ((x % cycleWidth) + cycleWidth) % cycleWidth - 30;
        } else if (type === 'sakura') {
            const movement = (t * p.v * 0.8) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            x = p.startX + Math.sin(t * 0.03 + p.o) * 50;
            x = ((x % cycleWidth) + cycleWidth) % cycleWidth - 30;
            rot = t * p.rotSpeed;
        } else if (type === 'firefly') {
            y = particleCanvas.height / 2 + Math.sin(t * 0.05 + p.o) * (particleCanvas.height * 0.4);
            x = particleCanvas.width / 2 + Math.cos(t * 0.05 + p.o) * (particleCanvas.width * 0.4);
        } else if (type === 'confetti') {
            const movement = (t * p.v) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            const xMovement = (t * p.vx) % cycleWidth;
            x = (p.startX + xMovement + cycleWidth) % cycleWidth - 30;
            rot = t * p.rotSpeed;
        } else if (['heart', 'star', 'sparkle'].includes(type)) {
            x = p.startX;
            y = p.startY;
        } else if (type === 'rain') {
            // 雨滴：快速斜向下落
            const movement = (t * p.v * 3) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            x = p.startX + movement * 0.3;
            x = ((x % cycleWidth) + cycleWidth) % cycleWidth - 30;
        } else {
            // snow
            const movement = (t * p.v) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            x = p.startX;
        }

        particleCtx.save();
        particleCtx.translate(x, y);
        if (type === 'sakura' || type === 'confetti') {
            particleCtx.rotate(rot * Math.PI / 180);
        }

        // 縮放
        if (['heart', 'star', 'sparkle'].includes(type)) {
            const pulseScale = p.s * (0.8 + Math.abs(Math.sin(t * 0.1 + p.o)) * 0.5);
            particleCtx.scale(pulseScale, pulseScale);
        } else {
            particleCtx.scale(p.s, p.s);
        }

        // 繪製不同粒子
        if (type === 'snow') {
            particleCtx.fillStyle = 'rgba(255,255,255,0.8)';
            particleCtx.beginPath();
            particleCtx.arc(0, 0, 5, 0, Math.PI*2);
            particleCtx.fill();
        } else if (type === 'rain') {
            particleCtx.strokeStyle = 'rgba(100, 150, 255, 0.6)';
            particleCtx.lineWidth = 2;
            particleCtx.beginPath();
            particleCtx.moveTo(0, -10);
            particleCtx.lineTo(3, 10);
            particleCtx.stroke();
        } else if (type === 'heart') {
            particleCtx.fillStyle = `rgba(255, 50, 50, 0.9)`;
            particleCtx.font = "30px Arial";
            particleCtx.textAlign = "center";
            particleCtx.fillText("❤", 0, 0);
        } else if (type === 'star') {
            particleCtx.fillStyle = `rgba(255, 255, 100, ${Math.abs(Math.sin(currentTime*0.1+p.o))})`;
            particleCtx.beginPath();
            particleCtx.arc(0, 0, 4, 0, Math.PI*2);
            particleCtx.fill();
        } else if (type === 'bubble') {
            particleCtx.strokeStyle = `rgba(100, 200, 255, 0.6)`;
            particleCtx.lineWidth = 2;
            particleCtx.beginPath();
            particleCtx.arc(0, 0, 8, 0, Math.PI*2);
            particleCtx.stroke();
            particleCtx.fillStyle = `rgba(255, 255, 255, 0.2)`;
            particleCtx.fill();
        } else if (type === 'sakura') {
            particleCtx.fillStyle = `rgba(255, 182, 193, 0.8)`;
            particleCtx.font = "25px Arial";
            particleCtx.textAlign = "center";
            particleCtx.fillText("🌸", 0, 0);
        } else if (type === 'sparkle') {
            const alpha = Math.abs(Math.sin(currentTime*0.15+p.o));
            particleCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            particleCtx.beginPath();
            particleCtx.moveTo(0, -6);
            particleCtx.lineTo(0, 6);
            particleCtx.moveTo(-6, 0);
            particleCtx.lineTo(6, 0);
            particleCtx.lineWidth = 2;
            particleCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            particleCtx.stroke();
        } else if (type === 'firefly') {
            const alpha = Math.abs(Math.sin(currentTime*0.2+p.o));
            particleCtx.fillStyle = `rgba(255, 255, 100, ${alpha})`;
            particleCtx.shadowBlur = 15;
            particleCtx.shadowColor = `rgba(255, 255, 100, ${alpha})`;
            particleCtx.beginPath();
            particleCtx.arc(0, 0, 3, 0, Math.PI*2);
            particleCtx.fill();
            particleCtx.shadowBlur = 0;
        } else if (type === 'confetti') {
            particleCtx.fillStyle = p.color;
            particleCtx.fillRect(-4, -8, 8, 16);
        }

        particleCtx.restore();
    });

    particleCtx.restore();
}

// 粒子動畫循環
function animateParticles() {
    const currentTime = Date.now() * 0.001;
    drawParticles(currentTime);
    particleAnimationId = requestAnimationFrame(animateParticles);
}

// 啟動/停止粒子系統
function updateParticleSystem() {
    const enabled = document.getElementById('particleEnable').checked;
    
    if (enabled) {
        resizeParticleCanvas();
        initParticles();
        if (!particleAnimationId) {
            animateParticles();
        }
    } else {
        if (particleAnimationId) {
            cancelAnimationFrame(particleAnimationId);
            particleAnimationId = null;
        }
        particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particles = [];
    }
}

function updateReflection() {

    }

    reflection.style.filter = 'brightness(0.5) saturate(0.3)'; // 變暗 + 降低飽和度

    reflection.style.animation = original.style.animation;
    
    // 開始位置同步
    syncReflectionPosition();

// 同步倒影位置（即時跟隨原圖）
function syncReflectionPosition() {
    const original = document.getElementById('previewImg');
    const reflection = document.getElementById('reflectionImg');
    
    if (!reflection || !reflection.isConnected) return;
    
    const lakeGap = parseInt(document.getElementById('reflectionGap').value) || 0;
    
    function update() {
        if (!reflection.isConnected) {
            reflectionAnimationId = null;
            return;
        }
        
        const originalRect = original.getBoundingClientRect();
        const containerRect = original.parentElement.getBoundingClientRect();
        
        // 計算倒影起點（原圖底部 + 間距）
        const reflectionTop = originalRect.bottom - containerRect.top + lakeGap;
        const reflectionLeft = originalRect.left - containerRect.left;
        
        // 更新倒影位置
        reflection.style.top = reflectionTop + 'px';
        reflection.style.left = reflectionLeft + 'px';
        
        // 倒影翻轉（以倒影頂部為軸垂直翻轉）
        reflection.style.transform = 'scaleY(-1)';
        
        reflectionAnimationId = requestAnimationFrame(update);
    }
    
    update();
}

// 同步鏡像位置（左右對稱）
function syncMirrorPosition() {

    if (!mirror || !mirror.isConnected) return;
    
    const container = original.parentElement;
    const containerWidth = container.offsetWidth;
    
    // 使用可調整的間距百分比（預設 20%）
    const mirrorGapPercent = parseInt(document.getElementById('mirrorGap').value) || 20;
    const offset = containerWidth * (mirrorGapPercent / 100);
    
    function update() {
        if (!mirror.isConnected) {
            mirrorAnimationId = null;
            return;
        }
        
        const containerRect = container.getBoundingClientRect();
        const centerX = containerRect.width / 2;
        const centerY = containerRect.height / 2;
        
        // 原圖往左偏移（使用 transform 而非改變 left）
        const originalTransform = `translate(calc(-50% - ${offset}px), -50%)`;
        
        // 鏡像往右偏移 + 水平翻轉
        const mirrorTransform = `translate(calc(-50% + ${offset}px), -50%) scaleX(-1)`;
        
        original.style.left = '50%';
        original.style.top = '50%';
        original.style.transform = originalTransform;
        
        mirror.style.left = '50%';
        mirror.style.top = '50%';
        mirror.style.transform = mirrorTransform;
        
        mirrorAnimationId = requestAnimationFrame(update);
    }
    
    update();
}

// 鏡像間距變更時更新
document.getElementById('mirrorGap').addEventListener('input', () => {
    if (document.getElementById('mirrorEnable').checked) {
        syncMirrorPosition();
    }
});

// 效能警告檢查
function checkPerformanceWarning() {
    const activeEffects = [];
    
    if (document.getElementById('rotateEnable')?.checked) activeEffects.push('旋轉');
    if (document.getElementById('scaleEnable')?.checked) activeEffects.push('縮放');
    if (document.getElementById('skewEnable')?.checked) activeEffects.push('扭曲');
    if (document.getElementById('tiltEnable')?.checked) activeEffects.push('傾斜');
    if (document.getElementById('blurEnable')?.checked) activeEffects.push('模糊');
    if (document.getElementById('shadowEnable')?.checked) activeEffects.push('陰影');
    if (document.getElementById('hueEnable')?.checked) activeEffects.push('色相');
    if (document.getElementById('rotate3dEnable')?.checked) activeEffects.push('3D旋轉');
    if (document.getElementById('shakeEnable')?.checked) activeEffects.push('抖動');
    if (document.getElementById('reflectionEnable')?.checked) activeEffects.push('倒影');
    if (document.getElementById('mirrorEnable')?.checked) activeEffects.push('鏡像');
    if (document.getElementById('particleEnable')?.checked) activeEffects.push('粒子');
    
    const warningDiv = document.getElementById('performanceWarning');
    
    if (activeEffects.length >= 4) {
        if (!warningDiv) {
            const div = document.createElement('div');
            div.id = 'performanceWarning';
            div.style.cssText = `
                background: #ff9800;
                color: #000;
                padding: 10px;
                margin: 10px 0;
                border-radius: 5px;
                font-size: 13px;
                font-weight: bold;
            `;
            div.innerHTML = '⚠️ 已啟用多個視覺效果，可能影響效能或瀏覽器播放順暢度';
            const sidebar = document.querySelector('.sidebar');
            const firstSection = document.querySelector('.section');
            if (sidebar && firstSection) {
                sidebar.insertBefore(div, firstSection);
            }
        }
    } else {
        if (warningDiv) {
            warningDiv.remove();
        }
    }
}

// 視窗大小變更時重新同步倒影/鏡像
window.addEventListener('resize', () => {
    if (document.getElementById('reflectionEnable').checked) {
        syncReflectionPosition();
    }
    if (document.getElementById('mirrorEnable').checked) {
        syncMirrorPosition();
    }
});
