<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation HTML Generator - 動畫HTML產生器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #121212; display: flex; overflow: hidden; height: 100vh; }

        /* 左側控制面板 */
        .sidebar { width: 480px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #555 #1e1e1e; }
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: #1e1e1e; }
        .sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        /* 右側預覽區 */
        .preview-area { flex: 1; background-color: #252525; background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2a2a2a 75%), linear-gradient(-45deg, transparent 75%, #2a2a2a 75%); background-size: 20px 20px; display: flex; align-items: center; justify-content: center; position: relative; }

        .container { max-width: 100%; background: transparent; border-radius: 0; padding: 0; box-shadow: none; }
        h1 { text-align: center; color: #ffeb3b; margin-bottom: 20px; font-size: 22px; }
        .section { margin-bottom: 15px; padding: 15px; background: #2a2a2a; border-radius: 8px; border: 1px solid #444; }
        .section h2 { font-size: 16px; margin-bottom: 12px; color: #ffeb3b; cursor: pointer; user-select: none; }
        .section h2::before { content: '▼ '; font-size: 12px; }
        .section.collapsed h2::before { content: '▶ '; }
        .section.collapsed .content { display: none; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; font-size: 14px; }
        input[type="file"], input[type="number"], input[type="color"], select { width: 100%; padding: 8px; border: 1px solid #555; border-radius: 5px; background: #1e1e1e; color: #fff; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #555; border-radius: 5px; background: #1e1e1e; color: #fff; }
        small { color: #999; }
        input[type="range"] { width: 100%; }
        .range-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input[type="checkbox"] { width: auto; }
        .effect-item { background: #1e1e1e; padding: 12px; margin-bottom: 8px; border-radius: 6px; border: 2px solid #444; }
        .effect-item.enabled { border-color: #ffeb3b; }
        .effect-controls { margin-top: 10px; display: none; }
        .effect-item.enabled .effect-controls { display: block; }
        .buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #ffeb3b; color: #000; font-weight: bold; }
        .btn-primary:hover { background: #ffd700; }
        .btn-secondary { background: #555; color: white; }
        .btn-secondary:hover { background: #666; }
        .template-btn { padding: 6px 12px; margin: 4px; border: 1px solid #ffeb3b; background: #2a2a2a; color: #ffeb3b; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .template-btn:hover { background: #ffeb3b; color: #000; }
        .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; color: #ccc; font-size: 13px; }

        /* 預覽區動畫容器 */
        #animationContainer { position: relative; width: 95%; height: 90%; overflow: hidden; border: 2px solid #444; border-radius: 8px; }
        #previewImg { position: absolute; will-change: transform, filter, opacity; transform-style: preserve-3d; pointer-events: none; height: auto; }
    </style>
</head>
<body>
    <!-- 左側控制面板 -->
    <div class="sidebar">
        <h1>🎨 Animation HTML Generator</h1>

        <!-- 操作按鈕 -->
        <div class="buttons">
            <button class="btn btn-secondary" onclick="importAnimation()">匯入動畫檔案</button>
            <button class="btn btn-secondary" onclick="resetSettings()">重置設定</button>
        </div>

        <!-- 基礎設定 -->
        <div class="section">
            <h2>基礎設定</h2>
            <div class="content">
                <div class="form-group">
                    <label>圖片上傳 (JPG/PNG/GIF/WebP)</label>
                    <input type="file" id="imageFile" accept="image/*">
                </div>
            </div>
        </div>

        <!-- 預設範本 -->
        <div class="section">
            <h2>快速範本</h2>
            <div class="content">
                <button class="template-btn" onclick="loadTemplate('pet')">桌面寵物</button>
                <button class="template-btn" onclick="loadTemplate('subscribe')">訂閱特效</button>
                <button class="template-btn" onclick="loadTemplate('energyBall')">能量球</button>
                <button class="template-btn" onclick="loadTemplate('float')">飄浮效果</button>
                <button class="template-btn" onclick="loadTemplate('randomPop')">隨機出現</button>
                <button class="template-btn" onclick="loadTemplate('padoru')">Padoru</button>
            </div>
        </div>

        <!-- 移動設定 -->
        <div class="section">
            <h2>移動設定</h2>
            <div class="content">
                <div class="form-group">
                    <label>移動模式</label>
                    <select id="moveMode">
                        <option value="static">靜止</option>
                        <option value="randomAppear">隨機出現</option>
                        <option value="randomBounce">彈跳移動</option>
                        <option value="leftToRight">水平: 左→右</option>
                        <option value="rightToLeft">水平: 右→左</option>
                        <option value="horizontalLoop">水平: 來回</option>
                        <option value="topToBottom">垂直: 上→下</option>
                        <option value="bottomToTop">垂直: 下→上</option>
                        <option value="verticalLoop">垂直: 來回</option>
                        <option value="diagonalTLBR">對角線: 左上→右下</option>
                        <option value="diagonalTRBL">對角線: 右上→左下</option>
                        <option value="diagonalBLTR">對角線: 左下→右上</option>
                        <option value="diagonalBRTL">對角線: 右下→左上</option>
                        <option value="circle">圓周運動</option>
                        <option value="zigzag">之字形</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>速度</label>
                    <input type="range" id="speed" min="1" max="10" value="5">
                    <div class="range-label"><span>慢</span><span id="speedVal">5</span><span>快</span></div>
                </div>
                <div class="form-group" id="horizontalPosGroup" style="display: none;">
                    <label>垂直位置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="horizontalPosition" value="top"> 頂部</label>
                        <label><input type="radio" name="horizontalPosition" value="middle" checked> 中間</label>
                        <label><input type="radio" name="horizontalPosition" value="bottom"> 底部</label>
                        <label><input type="radio" name="horizontalPosition" value="random"> 隨機</label>
                    </div>
                </div>
                <div class="form-group" id="horizontalLoopPosGroup" style="display: none;">
                    <label>垂直位置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="horizontalLoopPosition" value="top"> 頂部</label>
                        <label><input type="radio" name="horizontalLoopPosition" value="middle" checked> 中間</label>
                        <label><input type="radio" name="horizontalLoopPosition" value="bottom"> 底部</label>
                        <label><input type="radio" name="horizontalLoopPosition" value="random"> 隨機</label>
                    </div>
                </div>
                <div class="form-group" id="horizontalLoopStartGroup" style="display: none;">
                    <label>初始位置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="horizontalLoopStart" value="left" checked> 左側</label>
                        <label><input type="radio" name="horizontalLoopStart" value="right"> 右側</label>
                    </div>
                </div>
                <div class="form-group" id="verticalPosGroup" style="display: none;">
                    <label>水平位置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="verticalPosition" value="left"> 左側</label>
                        <label><input type="radio" name="verticalPosition" value="center" checked> 中間</label>
                        <label><input type="radio" name="verticalPosition" value="right"> 右側</label>
                        <label><input type="radio" name="verticalPosition" value="random"> 隨機</label>
                    </div>
                </div>
                <div class="form-group" id="verticalLoopPosGroup" style="display: none;">
                    <label>水平位置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="verticalLoopPosition" value="left"> 左側</label>
                        <label><input type="radio" name="verticalLoopPosition" value="center" checked> 中間</label>
                        <label><input type="radio" name="verticalLoopPosition" value="right"> 右側</label>
                        <label><input type="radio" name="verticalLoopPosition" value="random"> 隨機</label>
                    </div>
                </div>
                <div class="form-group" id="verticalLoopStartGroup" style="display: none;">
                    <label>初始位置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="verticalLoopStart" value="top" checked> 頂部</label>
                        <label><input type="radio" name="verticalLoopStart" value="bottom"> 底部</label>
                    </div>
                </div>
                <div class="form-group" id="circleRadiusGroup" style="display: none;">
                    <label>圓周半徑 (px)</label>
                    <input type="range" id="circleRadius" min="50" max="400" value="200">
                    <div class="range-label"><span>50</span><span id="circleRadiusVal">200</span><span>400</span></div>
                </div>
                <div class="form-group" id="circleCenterGroup" style="display: none;">
                    <label>旋轉中心</label>
                    <div class="radio-group">
                        <label><input type="radio" name="circleCenter" value="fixed" checked> 固定中心</label>
                        <label><input type="radio" name="circleCenter" value="random"> 隨機移動</label>
                    </div>
                </div>
                <div class="form-group" id="stayDurationGroup" style="display: none;">
                    <label>停留時間 (秒)</label>
                    <input type="range" id="stayDuration" min="0" max="5" step="0.5" value="1">
                    <div class="range-label"><span>0</span><span id="stayVal">1</span><span>5</span></div>
                </div>
                <div class="form-group checkbox-group" id="fadeGroup">
                    <input type="checkbox" id="fade">
                    <label for="fade" style="margin: 0;">淡入淡出</label>
                </div>
            </div>
        </div>

        <!-- 圖片變換 -->
        <div class="section">
            <h2>圖片變換</h2>
            <div class="content">
                <div class="form-group">
                    <label>翻轉</label>
                    <div class="radio-group">
                        <label><input type="radio" name="flip" value="none" checked> 無</label>
                        <label><input type="radio" name="flip" value="horizontal"> 水平</label>
                        <label><input type="radio" name="flip" value="vertical"> 垂直</label>
                        <label><input type="radio" name="flip" value="both"> 兩者</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 視覺特效 -->
        <div class="section">
            <h2>視覺特效 (可多選疊加)</h2>
            <div class="content">
                <!-- 旋轉 -->
                <div class="effect-item" id="effect-rotate">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rotateEnable">
                        <label for="rotateEnable" style="margin: 0; font-weight: bold;">旋轉</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>模式</label>
                            <select id="rotateMode">
                                <option value="clockwise">順時針</option>
                                <option value="counterclockwise">逆時針</option>
                                <option value="swing">來回擺動</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>速度</label>
                            <input type="range" id="rotateSpeed" min="1" max="10" value="5">
                            <div class="range-label"><span>慢</span><span id="rotateSpeedVal">5</span><span>快</span></div>
                        </div>
                    </div>
                </div>

                <!-- 縮放脈動 -->
                <div class="effect-item" id="effect-scale">
                    <div class="checkbox-group">
                        <input type="checkbox" id="scaleEnable">
                        <label for="scaleEnable" style="margin: 0; font-weight: bold;">縮放脈動</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>模式</label>
                            <select id="scaleMode">
                                <option value="pulse">呼吸效果</option>
                                <option value="bounce">彈跳效果</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>幅度</label>
                            <input type="range" id="scaleRange" min="0.5" max="2" step="0.1" value="1.3">
                            <div class="range-label"><span>0.5x</span><span id="scaleRangeVal">1.3x</span><span>2x</span></div>
                        </div>
                    </div>
                </div>

                <!-- 扭曲 -->
                <div class="effect-item" id="effect-skew">
                    <div class="checkbox-group">
                        <input type="checkbox" id="skewEnable">
                        <label for="skewEnable" style="margin: 0; font-weight: bold;">扭曲</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>方向</label>
                            <select id="skewDirection">
                                <option value="horizontal">水平拉伸</option>
                                <option value="vertical">垂直拉伸</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>強度 (度)</label>
                            <input type="range" id="skewStrength" min="1" max="30" value="15">
                            <div class="range-label"><span>1°</span><span id="skewStrengthVal">15°</span><span>30°</span></div>
                        </div>
                    </div>
                </div>

                <!-- 傾斜搖晃 -->
                <div class="effect-item" id="effect-tilt">
                    <div class="checkbox-group">
                        <input type="checkbox" id="tiltEnable">
                        <label for="tiltEnable" style="margin: 0; font-weight: bold;">傾斜搖晃</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>模式</label>
                            <select id="tiltMode">
                                <option value="swingLR">左右搖晃</option>
                                <option value="swingUD">上下搖晃</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>角度 (度)</label>
                            <input type="range" id="tiltAngle" min="1" max="45" value="20">
                            <div class="range-label"><span>1°</span><span id="tiltAngleVal">20°</span><span>45°</span></div>
                        </div>
                    </div>
                </div>

                <!-- 模糊 -->
                <div class="effect-item" id="effect-blur">
                    <div class="checkbox-group">
                        <input type="checkbox" id="blurEnable">
                        <label for="blurEnable" style="margin: 0; font-weight: bold;">模糊</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>類型</label>
                            <select id="blurType">
                                <option value="gaussian">高斯模糊</option>
                                <option value="motion">動態模糊</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>強度 (px)</label>
                            <input type="range" id="blurStrength" min="0" max="10" value="5">
                            <div class="range-label"><span>0</span><span id="blurStrengthVal">5</span><span>10</span></div>
                        </div>
                    </div>
                </div>

                <!-- 陰影/發光 -->
                <div class="effect-item" id="effect-shadow">
                    <div class="checkbox-group">
                        <input type="checkbox" id="shadowEnable">
                        <label for="shadowEnable" style="margin: 0; font-weight: bold;">陰影/發光</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>類型</label>
                            <select id="shadowType">
                                <option value="drop">投影</option>
                                <option value="glow">發光</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>顏色</label>
                            <input type="color" id="shadowColor" value="#000000">
                        </div>
                        <div class="form-group">
                            <label>強度 (px)</label>
                            <input type="range" id="shadowStrength" min="0" max="20" value="10">
                            <div class="range-label"><span>0</span><span id="shadowStrengthVal">10</span><span>20</span></div>
                        </div>
                    </div>
                </div>

                <!-- 色相旋轉 -->
                <div class="effect-item" id="effect-hue">
                    <div class="checkbox-group">
                        <input type="checkbox" id="hueEnable">
                        <label for="hueEnable" style="margin: 0; font-weight: bold;">色相旋轉 (彩虹)</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>速度</label>
                            <input type="range" id="hueSpeed" min="1" max="10" value="5">
                            <div class="range-label"><span>慢</span><span id="hueSpeedVal">5</span><span>快</span></div>
                        </div>
                    </div>
                </div>

                <!-- 3D旋轉 -->
                <!-- 負片 -->
                <div class="effect-item" id="effect-invert">
                    <div class="checkbox-group">
                        <input type="checkbox" id="invertEnable">
                        <label for="invertEnable" style="margin: 0; font-weight: bold;">負片 (Invert)</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>模式</label>
                            <select id="invertMode" onchange="updatePreview()">
                                <option value="static">靜態</option>
                                <option value="flash">閃爍</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="effect-item" id="effect-3d">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rotate3dEnable">
                        <label for="rotate3dEnable" style="margin: 0; font-weight: bold;">3D旋轉</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>軸向</label>
                            <select id="rotate3dAxis">
                                <option value="x">X軸 (上下翻)</option>
                                <option value="y">Y軸 (左右翻)</option>
                                <option value="z">Z軸 (平面轉)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>速度</label>
                            <input type="range" id="rotate3dSpeed" min="1" max="10" value="5">
                            <div class="range-label"><span>慢</span><span id="rotate3dSpeedVal">5</span><span>快</span></div>
                        </div>
                    </div>
                </div>

                <!-- 抖動 -->
                <div class="effect-item" id="effect-shake">
                    <div class="checkbox-group">
                        <input type="checkbox" id="shakeEnable">
                        <label for="shakeEnable" style="margin: 0; font-weight: bold;">抖動</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>強度 (px)</label>
                            <input type="range" id="shakeStrength" min="1" max="10" value="5">
                            <div class="range-label"><span>1</span><span id="shakeStrengthVal">5</span><span>10</span></div>
                        </div>
                    </div>
                </div>

                <!-- 粒子特效 -->
                <div class="effect-item" id="effect-particle">
                    <div class="checkbox-group">
                        <input type="checkbox" id="particleEnable">
                        <label for="particleEnable" style="margin: 0; font-weight: bold;">粒子特效</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>粒子類型</label>
                            <select id="particleType">
                                <option value="snow">❄️ 下雪</option>
                                <option value="rain">🌧️ 下雨</option>
                                <option value="heart">❤️ 愛心</option>
                                <option value="sakura">🌸 櫻花</option>
                                <option value="firefly">✨ 螢火蟲</option>
                                <option value="bubble">🫧 泡泡</option>
                                <option value="star">⭐ 星星</option>
                                <option value="sparkle">✨ 閃光</option>
                                <option value="confetti">🎊 彩紙</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>速度</label>
                            <input type="range" id="particleSpeed" min="0.01" max="0.5" step="0.01" value="0.1">
                            <div class="range-label"><span>慢</span><span id="particleSpeedVal">0.1</span><span>快</span></div>
                        </div>
                    </div>
                </div>

                <!-- 倒影效果 -->
                <div class="effect-item" id="effect-reflection">
                    <div class="checkbox-group">
                        <input type="checkbox" id="reflectionEnable">
                        <label for="reflectionEnable" style="margin: 0; font-weight: bold;">💧 倒影（水面）</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>倒影間距 <span id="reflectionGapVal">0</span>px</label>
                            <input type="range" id="reflectionGap" min="-100" max="100" value="0">
                            <div class="range-label"><span>-100px</span><span>0</span><span>+100px</span></div>
                            <small style="color: #888;">負值：縮小間距；正值：增加間距</small>
                        </div>
                    </div>
                </div>

                <!-- 鏡像效果 -->
                <div class="effect-item" id="effect-mirror">
                    <div class="checkbox-group">
                        <input type="checkbox" id="mirrorEnable">
                        <label for="mirrorEnable" style="margin: 0; font-weight: bold;">👥 鏡像（雙人）</label>
                    </div>
                    <div class="effect-controls">
                        <div class="form-group">
                            <label>鏡像間距 <span id="mirrorGapVal">20</span>%</label>
                            <input type="range" id="mirrorGap" min="0" max="50" value="20">
                            <div class="range-label"><span>0%</span><span>20%</span><span>50%</span></div>
                            <small style="color: #888;">左右分離距離（畫面寬度百分比）</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 其他設定 -->
        <div class="section">
            <h2>其他設定</h2>
            <div class="content">
                <div class="form-group">
                    <label>圖片大小 (%)</label>
                    <input type="range" id="size" min="10" max="200" value="100">
                    <div class="range-label"><span>10%</span><span id="sizeVal">100%</span><span>200%</span></div>
                </div>
                <div class="form-group">
                    <label>透明度 (%)</label>
                    <input type="range" id="opacity" min="0" max="100" value="100">
                    <div class="range-label"><span>0%</span><span id="opacityVal">100%</span><span>100%</span></div>
                </div>
                <div class="form-group">
                    <label>輸出檔名</label>
                    <input type="text" id="filename" value="output" placeholder="output">
                    <small style="color: #888;">自動加上 .html 副檔名</small>
                </div>
            </div>
        </div>

        <!-- 產生檔案 -->
        <div class="buttons" style="margin-top: 30px;">
            <button class="btn btn-primary" onclick="generateOutput()">產生動畫檔案</button>
        </div>

    </div>

    <!-- 右側預覽區 -->
    <!-- 右側預覽區 -->
    <div class="preview-area">
        <div id="animationContainer">
            <canvas id="particleCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
            <img id="previewImg" alt="Preview">
        </div>
    </div>

    <style id="dynamicStyle">
        /* 動態產生的 CSS 動畫會插入這裡 */
    </style>

    <script>

        // 粒子系統變數
        let particles = [];
        let particleAnimationId = null;
        const particleCanvas = document.getElementById('particleCanvas');
        const particleCtx = particleCanvas.getContext('2d');

        // 初始化
        // 初始化
        const rangeInputs = ['speed', 'stayDuration', 'circleRadius', 'rotateSpeed', 'scaleRange', 'skewStrength', 'tiltAngle', 'blurStrength', 'shadowStrength', 'hueSpeed', 'rotate3dSpeed', 'shakeStrength', 'particleSpeed', 'reflectionGap', 'mirrorGap', 'size', 'opacity'];
        rangeInputs.forEach(id => {
            const input = document.getElementById(id);
            const display = document.getElementById(id + 'Val');
            input.addEventListener('input', () => {
                let val = input.value;
                if (id === 'scaleRange') val += 'x';
                else if (id === 'skewStrength' || id === 'tiltAngle') val += '°';
                else if (id === 'blurStrength' || id === 'shadowStrength' || id === 'shakeStrength' || id === 'circleRadius' || id === 'reflectionGap') val += 'px';
                else if (id === 'size' || id === 'opacity' || id === 'mirrorGap') val += '%';
                display.textContent = val;

                // 即時更新預覽
                updatePreview();
            });
        });

        // 監聽所有 select 和 checkbox 變更
        document.querySelectorAll('select, input[type="checkbox"], input[type="radio"], input[type="color"]').forEach(el => {
            el.addEventListener('change', updatePreview);
        });

        // Transform 衝突的特效組（這些特效會互相覆蓋）
        const transformEffects = ['rotate', 'scale', 'skew', 'tilt', '3d', 'shake'];
        const nonTransformEffects = ['blur', 'shadow', 'hue', 'invert'];

        // 特效開關
        // 特效開關
        ['rotate', 'scale', 'skew', 'tilt', 'blur', 'shadow', 'hue', 'invert', '3d', 'shake', 'particle', 'reflection', 'mirror'].forEach(name => {
            const checkbox = document.getElementById(name === '3d' ? 'rotate3dEnable' : name + 'Enable');
            const item = document.getElementById('effect-' + name);
            checkbox.addEventListener('change', () => {
                item.classList.toggle('enabled', checkbox.checked);

                // 粒子系統特殊處理
                if (name === 'particle') {
                    updateParticleSystem();
                }

                // 倒影特殊處理
                if (name === 'reflection') {
                    toggleReflection();
                }

                // 鏡像特殊處理
                if (name === 'mirror') {
                    toggleMirror();
                }

                // 如果是 transform 相關特效，處理互斥邏輯
                if (transformEffects.includes(name)) {
                    handleTransformConflict(name, checkbox.checked);
                }

                // 檢查效能警告
                checkPerformanceWarning();
            });
        });

        // 處理 transform 特效的互斥邏輯
        function handleTransformConflict(currentEffect, isChecked) {
            if (isChecked) {
                // 禁用其他 transform 特效
                transformEffects.forEach(effect => {
                    if (effect !== currentEffect) {
                        const otherCheckbox = document.getElementById(effect === '3d' ? 'rotate3dEnable' : effect + 'Enable');
                        otherCheckbox.disabled = true;
                        otherCheckbox.parentElement.style.opacity = '0.5';
                        otherCheckbox.parentElement.style.cursor = 'not-allowed';
                    }
                });
            } else {
                // 檢查是否還有其他 transform 特效被勾選
                const anyChecked = transformEffects.some(effect => {
                    const cb = document.getElementById(effect === '3d' ? 'rotate3dEnable' : effect + 'Enable');
                    return cb.checked;
                });

                // 如果沒有任何 transform 特效被勾選，恢復所有選項
                if (!anyChecked) {
                    transformEffects.forEach(effect => {
                        const otherCheckbox = document.getElementById(effect === '3d' ? 'rotate3dEnable' : effect + 'Enable');
                        otherCheckbox.disabled = false;
                        otherCheckbox.parentElement.style.opacity = '1';
                        otherCheckbox.parentElement.style.cursor = 'pointer';
                    });
                }
            }
        }

        // 移動模式選擇顯示對應位置設定
        const moveMode = document.getElementById('moveMode');
        const horizontalPosGroup = document.getElementById('horizontalPosGroup');
        const horizontalLoopPosGroup = document.getElementById('horizontalLoopPosGroup');
        const verticalPosGroup = document.getElementById('verticalPosGroup');
        const verticalLoopPosGroup = document.getElementById('verticalLoopPosGroup');
        const horizontalLoopStartGroup = document.getElementById('horizontalLoopStartGroup');
        const verticalLoopStartGroup = document.getElementById('verticalLoopStartGroup');
        const circleRadiusGroup = document.getElementById('circleRadiusGroup');
        const circleCenterGroup = document.getElementById('circleCenterGroup');
        const stayDurationGroup = document.getElementById('stayDurationGroup');
        const fadeGroup = document.getElementById('fadeGroup');

        function updatePositionVisibility() {
            const mode = moveMode.value;
            const horizontalModes = ['leftToRight', 'rightToLeft'];
            const verticalModes = ['topToBottom', 'bottomToTop'];
            const stayModes = ['randomAppear', 'horizontalLoop', 'verticalLoop'];

            horizontalPosGroup.style.display = horizontalModes.includes(mode) ? 'block' : 'none';
            horizontalLoopPosGroup.style.display = mode === 'horizontalLoop' ? 'block' : 'none';
            verticalPosGroup.style.display = verticalModes.includes(mode) ? 'block' : 'none';
            verticalLoopPosGroup.style.display = mode === 'verticalLoop' ? 'block' : 'none';
            horizontalLoopStartGroup.style.display = mode === 'horizontalLoop' ? 'block' : 'none';
            verticalLoopStartGroup.style.display = mode === 'verticalLoop' ? 'block' : 'none';
            circleRadiusGroup.style.display = mode === 'circle' ? 'block' : 'none';
            circleCenterGroup.style.display = mode === 'circle' ? 'block' : 'none';
            stayDurationGroup.style.display = stayModes.includes(mode) ? 'block' : 'none';
            fadeGroup.style.display = mode !== 'static' ? 'block' : 'none';
        }

        moveMode.addEventListener('change', updatePositionVisibility);
        updatePositionVisibility();

        // 全域變數
        let currentImageData = null;
        const previewImg = document.getElementById('previewImg');
        const dynamicStyle = document.getElementById('dynamicStyle');

        // 圖片上傳
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 50 * 1024 * 1024) {
                alert('檔案過大！建議 < 50MB，過大可能影響效能');
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                currentImageData = event.target.result;
                updatePreview(); // 立即更新預覽
            };
            reader.readAsDataURL(file);
        });

        // 摺疊功能
        document.querySelectorAll('.section h2').forEach(h2 => {
            h2.addEventListener('click', () => {
                h2.parentElement.classList.toggle('collapsed');
            });
        });

        // 取得目前所有設定
        function getCurrentConfig() {
            return {
                image: currentImageData,
                movement: {
                    mode: document.getElementById('moveMode').value,
                    speed: parseInt(document.getElementById('speed').value),
                    stayDuration: parseFloat(document.getElementById('stayDuration').value),
                    fade: document.getElementById('fade').checked,
                    horizontalPosition: document.querySelector('input[name="horizontalPosition"]:checked')?.value || 'middle',
                    horizontalLoopPosition: document.querySelector('input[name="horizontalLoopPosition"]:checked')?.value || 'middle',
                    verticalPosition: document.querySelector('input[name="verticalPosition"]:checked')?.value || 'center',
                    verticalLoopPosition: document.querySelector('input[name="verticalLoopPosition"]:checked')?.value || 'center',
                    horizontalLoopStart: document.querySelector('input[name="horizontalLoopStart"]:checked')?.value || 'left',
                    verticalLoopStart: document.querySelector('input[name="verticalLoopStart"]:checked')?.value || 'top',
                    circleRadius: parseInt(document.getElementById('circleRadius').value),
                    circleCenter: document.querySelector('input[name="circleCenter"]:checked')?.value || 'fixed'
                },
                flip: document.querySelector('input[name="flip"]:checked').value,
                effects: {
                    rotate: {
                        enabled: document.getElementById('rotateEnable').checked,
                        mode: document.getElementById('rotateMode').value,
                        speed: parseInt(document.getElementById('rotateSpeed').value)
                    },
                    scale: {
                        enabled: document.getElementById('scaleEnable').checked,
                        mode: document.getElementById('scaleMode').value,
                        range: parseFloat(document.getElementById('scaleRange').value)
                    },
                    skew: {
                        enabled: document.getElementById('skewEnable').checked,
                        direction: document.getElementById('skewDirection').value,
                        strength: parseInt(document.getElementById('skewStrength').value)
                    },
                    tilt: {
                        enabled: document.getElementById('tiltEnable').checked,
                        mode: document.getElementById('tiltMode').value,
                        angle: parseInt(document.getElementById('tiltAngle').value)
                    },
                    blur: {
                        enabled: document.getElementById('blurEnable').checked,
                        type: document.getElementById('blurType').value,
                        strength: parseInt(document.getElementById('blurStrength').value)
                    },
                    shadow: {
                        enabled: document.getElementById('shadowEnable').checked,
                        type: document.getElementById('shadowType').value,
                        color: document.getElementById('shadowColor').value,
                        strength: parseInt(document.getElementById('shadowStrength').value)
                    },
                    hueRotate: {
                        enabled: document.getElementById('hueEnable').checked,
                        speed: parseInt(document.getElementById('hueSpeed').value)
                    },
                    invert: {
                        enabled: document.getElementById('invertEnable').checked,
                        mode: document.getElementById('invertMode').value
                    },
                    rotate3d: {
                        enabled: document.getElementById('rotate3dEnable').checked,
                        axis: document.getElementById('rotate3dAxis').value,
                        speed: parseInt(document.getElementById('rotate3dSpeed').value)
                    },
                    shake: {
                        enabled: document.getElementById('shakeEnable').checked,
                        strength: parseInt(document.getElementById('shakeStrength').value)
                    },
                    reflection: {
                        enabled: document.getElementById('reflectionEnable').checked,
                        gap: parseInt(document.getElementById('reflectionGap').value)
                    },
                    mirror: {
                        enabled: document.getElementById('mirrorEnable').checked,
                        gap: parseInt(document.getElementById('mirrorGap').value)
                    }
                },
                size: parseInt(document.getElementById('size').value),
                opacity: parseInt(document.getElementById('opacity').value)
            };
        }

        // 即時更新預覽
        function updatePreview() {
            if (!currentImageData) return;

            const config = getCurrentConfig();

            // 設定圖片基本屬性
            previewImg.src = config.image;
            previewImg.style.width = config.size + '%';
            previewImg.style.opacity = config.opacity / 100;

            // 產生CSS動畫（簡化版，只處理主要移動模式）
            generatePreviewAnimation(config);
        }

        // 產生預覽動畫CSS
        function generatePreviewAnimation(config) {
            // 清除舊動畫
            previewImg.style.animation = 'none';
            previewImg.style.transform = '';
            previewImg.style.filter = '';
            dynamicStyle.textContent = '';

            const movement = config.movement;
            const speed = 11 - movement.speed;
            let css = '';
            let animations = [];
            let filters = [];

            // 翻轉
            let flipTransform = '';
            if (config.flip === 'horizontal') flipTransform = 'scaleX(-1)';
            else if (config.flip === 'vertical') flipTransform = 'scaleY(-1)';
            else if (config.flip === 'both') flipTransform = 'scaleX(-1) scaleY(-1)';

            // 移動模式
            switch(movement.mode) {
                case 'static':
                    previewImg.style.left = '50%';
                    previewImg.style.top = '50%';
                    previewImg.style.transform = `translate(-50%, -50%) ${flipTransform}`;
                    break;

                case 'leftToRight':
                    const ltrPos = document.querySelector('input[name="horizontalPosition"]:checked')?.value || 'middle';
                    let ltrTopPos, ltrTransform;
                    if (ltrPos === 'top') {
                        ltrTopPos = '0%';
                        ltrTransform = `translateY(0%) ${flipTransform}`;
                    } else if (ltrPos === 'bottom') {
                        ltrTopPos = '100%';
                        ltrTransform = `translateY(-100%) ${flipTransform}`;
                    } else if (ltrPos === 'random') {
                        ltrTopPos = (Math.random() * 80 + 10) + '%';
                        ltrTransform = `translateY(-50%) ${flipTransform}`;
                    } else {
                        ltrTopPos = '50%';
                        ltrTransform = `translateY(-50%) ${flipTransform}`;
                    }
                    css += `@keyframes preview-leftToRight {
                        from { left: -20%; }
                        to { left: 120%; }
                    }\n`;
                    animations.push(`preview-leftToRight ${speed}s linear infinite`);
                    previewImg.style.top = ltrTopPos;
                    previewImg.style.transform = ltrTransform;
                    break;

                case 'rightToLeft':
                    const rtlPos = document.querySelector('input[name="horizontalPosition"]:checked')?.value || 'middle';
                    let rtlTopPos, rtlTransform;
                    if (rtlPos === 'top') {
                        rtlTopPos = '0%';
                        rtlTransform = `translateY(0%) ${flipTransform}`;
                    } else if (rtlPos === 'bottom') {
                        rtlTopPos = '100%';
                        rtlTransform = `translateY(-100%) ${flipTransform}`;
                    } else if (rtlPos === 'random') {
                        rtlTopPos = (Math.random() * 80 + 10) + '%';
                        rtlTransform = `translateY(-50%) ${flipTransform}`;
                    } else {
                        rtlTopPos = '50%';
                        rtlTransform = `translateY(-50%) ${flipTransform}`;
                    }
                    css += `@keyframes preview-rightToLeft {
                        from { left: 120%; }
                        to { left: -20%; }
                    }\n`;
                    animations.push(`preview-rightToLeft ${speed}s linear infinite`);
                    previewImg.style.top = rtlTopPos;
                    previewImg.style.transform = rtlTransform;
                    break;

                case 'horizontalLoop':
                    // 停止任何現有的來回動畫
                    if (window.previewLoopInterval) {
                        clearInterval(window.previewLoopInterval);
                    }
                    
                    const hLoopPos = document.querySelector('input[name="horizontalLoopPosition"]:checked')?.value || 'middle';
                    const hLoopStart = document.querySelector('input[name="horizontalLoopStart"]:checked')?.value || 'left';
                    const startPos = hLoopStart === 'left' ? -20 : 120;
                    const endPos = hLoopStart === 'left' ? 120 : -20;
                    
                    function getHLoopTop() {
                        if (hLoopPos === 'random') return (Math.random() * 80 + 10) + '%';
                        return hLoopPos === 'top' ? '0%' : hLoopPos === 'bottom' ? '100%' : '50%';
                    }
                    
                    function getHLoopTransform(flipX) {
                        if (hLoopPos === 'random') return `translateY(-50%) scaleX(${flipX})`;
                        if (hLoopPos === 'top') return `translateY(0%) scaleX(${flipX})`;
                        if (hLoopPos === 'bottom') return `translateY(-100%) scaleX(${flipX})`;
                        return `translateY(-50%) scaleX(${flipX})`;
                    }
                    
                    const totalDuration = speed * 2000; // 來回總時間
                    let currentFlipX = 1;
                    let isMovingForward = true;
                    
                    previewImg.style.top = getHLoopTop();
                    previewImg.style.left = startPos + '%';
                    previewImg.style.transition = 'none';
                    
                    function animateHLoop() {
                        if (isMovingForward) {
                            previewImg.style.left = startPos + '%';
                            previewImg.style.top = getHLoopTop();
                            previewImg.style.transform = getHLoopTransform(currentFlipX) + ' ' + flipTransform;
                            
                            setTimeout(() => {
                                previewImg.style.transition = `left ${totalDuration/2}ms linear`;
                                previewImg.style.left = endPos + '%';
                            }, 50);
                            
                            window.previewLoopInterval = setTimeout(() => {
                                currentFlipX = -1;
                                previewImg.style.transition = 'none';
                                previewImg.style.transform = getHLoopTransform(currentFlipX) + ' ' + flipTransform;
                                isMovingForward = false;
                                setTimeout(animateHLoop, 50);
                            }, totalDuration/2);
                        } else {
                            previewImg.style.left = endPos + '%';
                            previewImg.style.top = getHLoopTop();
                            previewImg.style.transform = getHLoopTransform(currentFlipX) + ' ' + flipTransform;
                            
                            setTimeout(() => {
                                previewImg.style.transition = `left ${totalDuration/2}ms linear`;
                                previewImg.style.left = startPos + '%';
                            }, 50);
                            
                            window.previewLoopInterval = setTimeout(() => {
                                currentFlipX = 1;
                                previewImg.style.transition = 'none';
                                previewImg.style.transform = getHLoopTransform(currentFlipX) + ' ' + flipTransform;
                                isMovingForward = true;
                                setTimeout(animateHLoop, 50);
                            }, totalDuration/2);
                        }
                    }
                    
                    animateHLoop();
                    break;

                case 'topToBottom':
                    const ttbPos = document.querySelector('input[name="verticalPosition"]:checked')?.value || 'center';
                    let ttbLeftPos, ttbTransform;
                    if (ttbPos === 'left') {
                        ttbLeftPos = '0%';
                        ttbTransform = `translateX(0%) ${flipTransform}`;
                    } else if (ttbPos === 'right') {
                        ttbLeftPos = '100%';
                        ttbTransform = `translateX(-100%) ${flipTransform}`;
                    } else if (ttbPos === 'random') {
                        ttbLeftPos = (Math.random() * 80 + 10) + '%';
                        ttbTransform = `translateX(-50%) ${flipTransform}`;
                    } else {
                        ttbLeftPos = '50%';
                        ttbTransform = `translateX(-50%) ${flipTransform}`;
                    }
                    css += `@keyframes preview-topToBottom {
                        from { top: -20%; }
                        to { top: 120%; }
                    }\n`;
                    animations.push(`preview-topToBottom ${speed}s linear infinite`);
                    previewImg.style.left = ttbLeftPos;
                    previewImg.style.transform = ttbTransform;
                    break;

                case 'bottomToTop':
                    const bttPos = document.querySelector('input[name="verticalPosition"]:checked')?.value || 'center';
                    let bttLeftPos, bttTransform;
                    if (bttPos === 'left') {
                        bttLeftPos = '0%';
                        bttTransform = `translateX(0%) ${flipTransform}`;
                    } else if (bttPos === 'right') {
                        bttLeftPos = '100%';
                        bttTransform = `translateX(-100%) ${flipTransform}`;
                    } else if (bttPos === 'random') {
                        bttLeftPos = (Math.random() * 80 + 10) + '%';
                        bttTransform = `translateX(-50%) ${flipTransform}`;
                    } else {
                        bttLeftPos = '50%';
                        bttTransform = `translateX(-50%) ${flipTransform}`;
                    }
                    css += `@keyframes preview-bottomToTop {
                        from { top: 120%; }
                        to { top: -20%; }
                    }\n`;
                    animations.push(`preview-bottomToTop ${speed}s linear infinite`);
                    previewImg.style.left = bttLeftPos;
                    previewImg.style.transform = bttTransform;
                    break;

                case 'verticalLoop':
                    // 停止任何現有的來回動畫
                    if (window.previewLoopInterval) {
                        clearInterval(window.previewLoopInterval);
                    }
                    
                    const vLoopPos = document.querySelector('input[name="verticalLoopPosition"]:checked')?.value || 'center';
                    const vLoopStart = document.querySelector('input[name="verticalLoopStart"]:checked')?.value || 'top';
                    const vStartPos = vLoopStart === 'top' ? -20 : 120;
                    const vEndPos = vLoopStart === 'top' ? 120 : -20;
                    
                    function getVLoopLeft() {
                        if (vLoopPos === 'random') return (Math.random() * 80 + 10) + '%';
                        return vLoopPos === 'left' ? '0%' : vLoopPos === 'right' ? '100%' : '50%';
                    }
                    
                    function getVLoopTransform(flipY) {
                        if (vLoopPos === 'random') return `translateX(-50%) scaleY(${flipY})`;
                        if (vLoopPos === 'left') return `translateX(0%) scaleY(${flipY})`;
                        if (vLoopPos === 'right') return `translateX(-100%) scaleY(${flipY})`;
                        return `translateX(-50%) scaleY(${flipY})`;
                    }
                    
                    const vTotalDuration = speed * 2000; // 來回總時間
                    let currentFlipY = 1;
                    let isMovingDown = vLoopStart === 'top';
                    
                    previewImg.style.left = getVLoopLeft();
                    previewImg.style.top = vStartPos + '%';
                    previewImg.style.transition = 'none';
                    
                    function animateVLoop() {
                        if ((vLoopStart === 'top' && isMovingDown) || (vLoopStart === 'bottom' && !isMovingDown)) {
                            previewImg.style.top = vStartPos + '%';
                            previewImg.style.left = getVLoopLeft();
                            previewImg.style.transform = getVLoopTransform(currentFlipY) + ' ' + flipTransform;
                            
                            setTimeout(() => {
                                previewImg.style.transition = `top ${vTotalDuration/2}ms linear`;
                                previewImg.style.top = vEndPos + '%';
                            }, 50);
                            
                            window.previewLoopInterval = setTimeout(() => {
                                currentFlipY = -1;
                                previewImg.style.transition = 'none';
                                previewImg.style.transform = getVLoopTransform(currentFlipY) + ' ' + flipTransform;
                                isMovingDown = !isMovingDown;
                                setTimeout(animateVLoop, 50);
                            }, vTotalDuration/2);
                        } else {
                            previewImg.style.top = vEndPos + '%';
                            previewImg.style.left = getVLoopLeft();
                            previewImg.style.transform = getVLoopTransform(currentFlipY) + ' ' + flipTransform;
                            
                            setTimeout(() => {
                                previewImg.style.transition = `top ${vTotalDuration/2}ms linear`;
                                previewImg.style.top = vStartPos + '%';
                            }, 50);
                            
                            window.previewLoopInterval = setTimeout(() => {
                                currentFlipY = 1;
                                previewImg.style.transition = 'none';
                                previewImg.style.transform = getVLoopTransform(currentFlipY) + ' ' + flipTransform;
                                isMovingDown = !isMovingDown;
                                setTimeout(animateVLoop, 50);
                            }, vTotalDuration/2);
                        }
                    }
                    
                    animateVLoop();
                    break;

                case 'diagonalTLBR':
                    css += `@keyframes preview-diagonalTLBR {
                        from { left: -20%; top: -20%; }
                        to { left: 120%; top: 120%; }
                    }\n`;
                    animations.push(`preview-diagonalTLBR ${speed}s linear infinite`);
                    previewImg.style.transform = flipTransform;
                    break;

                case 'diagonalTRBL':
                    css += `@keyframes preview-diagonalTRBL {
                        from { left: 120%; top: -20%; }
                        to { left: -20%; top: 120%; }
                    }\n`;
                    animations.push(`preview-diagonalTRBL ${speed}s linear infinite`);
                    previewImg.style.transform = flipTransform;
                    break;

                case 'diagonalBLTR':
                    css += `@keyframes preview-diagonalBLTR {
                        from { left: -20%; top: 120%; }
                        to { left: 120%; top: -20%; }
                    }\n`;
                    animations.push(`preview-diagonalBLTR ${speed}s linear infinite`);
                    previewImg.style.transform = flipTransform;
                    break;

                case 'diagonalBRTL':
                    css += `@keyframes preview-diagonalBRTL {
                        from { left: 120%; top: 120%; }
                        to { left: -20%; top: -20%; }
                    }\n`;
                    animations.push(`preview-diagonalBRTL ${speed}s linear infinite`);
                    previewImg.style.transform = flipTransform;
                    break;

                case 'circle':
                    const radius = movement.circleRadius || 200;
                    const centerMode = movement.circleCenter || 'fixed';
                    
                    if (centerMode === 'fixed') {
                        // 固定中心
                        css += `@keyframes preview-circle {
                            from { transform: translate(-50%, -50%) rotate(0deg) translateX(${radius}px) rotate(0deg) ${flipTransform}; }
                            to { transform: translate(-50%, -50%) rotate(360deg) translateX(${radius}px) rotate(-360deg) ${flipTransform}; }
                        }\n`;
                        animations.push(`preview-circle ${speed}s linear infinite`);
                        previewImg.style.left = '50%';
                        previewImg.style.top = '50%';
                    } else {
                        // 隨機移動中心
                        if (window.previewCircleFrame) {
                            cancelAnimationFrame(window.previewCircleFrame);
                        }
                        if (window.previewCircleTimeout) {
                            clearTimeout(window.previewCircleTimeout);
                        }
                        
                        const container = document.getElementById('animationContainer');
                        let centerX = 50;
                        let centerY = 50;
                        let angle = 0;
                        
                        function rotateStep() {
                            angle += (360 / (speed * 1000)) * 16;
                            if (angle >= 360) angle -= 360;
                            
                            const rad = (angle * Math.PI) / 180;
                            const radiusPercent = (radius / container.offsetWidth * 100);
                            const x = centerX + radiusPercent * Math.cos(rad);
                            const y = centerY + radiusPercent * Math.sin(rad);
                            
                            previewImg.style.left = x + '%';
                            previewImg.style.top = y + '%';
                            previewImg.style.transform = `translate(-50%, -50%) ${flipTransform}`;
                            
                            window.previewCircleFrame = requestAnimationFrame(rotateStep);
                        }
                        
                        function changeCenter() {
                            centerX = 20 + Math.random() * 60;
                            centerY = 20 + Math.random() * 60;
                            window.previewCircleTimeout = setTimeout(changeCenter, 3000);
                        }
                        
                        rotateStep();
                        changeCenter();
                    }
                    break;

                case 'zigzag':
                    css += `@keyframes preview-zigzag {
                        0% { left: -20%; top: 20%; }
                        25% { left: 30%; top: 80%; }
                        50% { left: 50%; top: 20%; }
                        75% { left: 80%; top: 80%; }
                        100% { left: 120%; top: 20%; }
                    }\n`;
                    animations.push(`preview-zigzag ${speed}s linear infinite`);
                    previewImg.style.transform = flipTransform;
                    break;

                case 'randomAppear':
                    // 停止任何現有的隨機動畫
                    if (window.previewRandomInterval) {
                        clearInterval(window.previewRandomInterval);
                    }
                    
                    css += `@keyframes preview-randomAppear {
                        0%, 100% { opacity: 0; }
                        10%, 90% { opacity: ${config.opacity / 100}; }
                    }\n`;
                    animations.push(`preview-randomAppear ${speed}s infinite`);
                    
                    // 設定初始位置
                    previewImg.style.left = '50%';
                    previewImg.style.top = '50%';
                    previewImg.style.transform = `translate(-50%, -50%) ${flipTransform}`;
                    
                    // 定期隨機改變位置
                    window.previewRandomInterval = setInterval(() => {
                        const container = document.getElementById('animationContainer');
                        const maxX = container.offsetWidth - previewImg.offsetWidth;
                        const maxY = container.offsetHeight - previewImg.offsetHeight;
                        const x = Math.random() * maxX;
                        const y = Math.random() * maxY;
                        previewImg.style.left = x + 'px';
                        previewImg.style.top = y + 'px';
                        previewImg.style.transform = flipTransform;
                    }, speed * 1000);
                    break;

                case 'randomBounce':
                    // 停止任何現有的隨機動畫
                    if (window.previewRandomInterval) {
                        clearInterval(window.previewRandomInterval);
                    }
                    if (window.previewBounceFrame) {
                        cancelAnimationFrame(window.previewBounceFrame);
                    }
                    
                    const container = document.getElementById('animationContainer');
                    let x = Math.random() * container.offsetWidth;
                    let y = Math.random() * container.offsetHeight;
                    let vx = (Math.random() - 0.5) * (11 - speed);
                    let vy = (Math.random() - 0.5) * (11 - speed);
                    
                    previewImg.style.transform = flipTransform;
                    
                    function bounce() {
                        x += vx;
                        y += vy;
                        
                        const imgWidth = previewImg.offsetWidth;
                        const imgHeight = previewImg.offsetHeight;
                        
                        if (x <= 0 || x >= container.offsetWidth - imgWidth) vx = -vx;
                        if (y <= 0 || y >= container.offsetHeight - imgHeight) vy = -vy;
                        
                        previewImg.style.left = x + 'px';
                        previewImg.style.top = y + 'px';
                        window.previewBounceFrame = requestAnimationFrame(bounce);
                    }
                    bounce();
                    break;

                default:
                    previewImg.style.left = '50%';
                    previewImg.style.top = '50%';
                    previewImg.style.transform = `translate(-50%, -50%) ${flipTransform}`;
            }

            // 特效動畫
            const effects = config.effects;

            // 旋轉
            if (effects.rotate.enabled) {
                const rotSpeed = 11 - effects.rotate.speed;
                if (effects.rotate.mode === 'clockwise') {
                    css += '@keyframes preview-rotate-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }\n';
                    animations.push(`preview-rotate-cw ${rotSpeed}s linear infinite`);
                } else if (effects.rotate.mode === 'counterclockwise') {
                    css += '@keyframes preview-rotate-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }\n';
                    animations.push(`preview-rotate-ccw ${rotSpeed}s linear infinite`);
                } else if (effects.rotate.mode === 'swing') {
                    css += '@keyframes preview-rotate-swing { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }\n';
                    animations.push(`preview-rotate-swing ${rotSpeed}s ease-in-out infinite`);
                }
            }

            // 縮放脈動
            if (effects.scale.enabled) {
                const scaleSpeed = 3;
                const scaleRange = effects.scale.range;
                css += `@keyframes preview-scale-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(${scaleRange}); } }\n`;
                animations.push(`preview-scale-pulse ${scaleSpeed}s ease-in-out infinite`);
            }

            // 扭曲
            if (effects.skew.enabled) {
                const skewStr = effects.skew.strength;
                if (effects.skew.direction === 'horizontal') {
                    css += `@keyframes preview-skew-h { 0%, 100% { transform: skewX(-${skewStr}deg); } 50% { transform: skewX(${skewStr}deg); } }\n`;
                    animations.push(`preview-skew-h 3s ease-in-out infinite`);
                } else {
                    css += `@keyframes preview-skew-v { 0%, 100% { transform: skewY(-${skewStr}deg); } 50% { transform: skewY(${skewStr}deg); } }\n`;
                    animations.push(`preview-skew-v 3s ease-in-out infinite`);
                }
            }

            // 傾斜搖晃
            if (effects.tilt.enabled) {
                const tiltAngle = effects.tilt.angle;
                if (effects.tilt.mode === 'swingLR') {
                    css += `@keyframes preview-tilt-lr { 0%, 100% { transform: rotate(-${tiltAngle}deg); } 50% { transform: rotate(${tiltAngle}deg); } }\n`;
                    animations.push(`preview-tilt-lr 2s ease-in-out infinite`);
                } else {
                    css += `@keyframes preview-tilt-ud { 0%, 100% { transform: rotateX(-${tiltAngle}deg); } 50% { transform: rotateX(${tiltAngle}deg); } }\n`;
                    animations.push(`preview-tilt-ud 2s ease-in-out infinite`);
                }
            }

            // 色相旋轉
            if (effects.hueRotate.enabled) {
                const hueSpeed = 11 - effects.hueRotate.speed;
                css += '@keyframes preview-hue-rotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }\n';
                animations.push(`preview-hue-rotate ${hueSpeed}s linear infinite`);
            }

            // 負片
            if (effects.invert && effects.invert.enabled) {
                if (effects.invert.mode === 'flash') {
                    css += '@keyframes preview-invert-flash { 0%, 49% { filter: invert(100%); } 50%, 100% { filter: none; } }\n';
                    animations.push('preview-invert-flash 1s step-end infinite');
                } else {
                    filters.push('invert(100%)');
                }
            }

            // 3D旋轉
            if (effects.rotate3d.enabled) {
                const r3dSpeed = 11 - effects.rotate3d.speed;
                const axis = effects.rotate3d.axis.toUpperCase();
                css += `@keyframes preview-rotate3d-${axis} { from { transform: rotate${axis}(0deg); } to { transform: rotate${axis}(360deg); } }\n`;
                animations.push(`preview-rotate3d-${axis} ${r3dSpeed}s linear infinite`);
            }

            // 抖動
            if (effects.shake.enabled) {
                const shakeStr = effects.shake.strength;
                css += `@keyframes preview-shake {
                    0%, 100% { transform: translate(0, 0); }
                    10% { transform: translate(-${shakeStr}px, ${shakeStr}px); }
                    20% { transform: translate(${shakeStr}px, -${shakeStr}px); }
                    30% { transform: translate(-${shakeStr}px, -${shakeStr}px); }
                    40% { transform: translate(${shakeStr}px, ${shakeStr}px); }
                    50% { transform: translate(-${shakeStr}px, ${shakeStr}px); }
                    60% { transform: translate(${shakeStr}px, -${shakeStr}px); }
                    70% { transform: translate(-${shakeStr}px, -${shakeStr}px); }
                    80% { transform: translate(${shakeStr}px, ${shakeStr}px); }
                    90% { transform: translate(-${shakeStr}px, -${shakeStr}px); }
                }\n`;
                animations.push(`preview-shake 0.5s infinite`);
            }

            // 陰影/發光
            if (effects.shadow.enabled) {
                const shadowStr = effects.shadow.strength;
                const shadowColor = effects.shadow.color;
                if (effects.shadow.type === 'drop') {
                    filters.push(`drop-shadow(${shadowStr}px ${shadowStr}px ${shadowStr}px ${shadowColor})`);
                } else {
                    filters.push(`drop-shadow(0 0 ${shadowStr}px ${shadowColor})`);
                }
            }

            // 模糊
            if (effects.blur.enabled && effects.blur.type === 'gaussian') {
                filters.push(`blur(${effects.blur.strength}px)`);
            }

            // 套用
            dynamicStyle.textContent = css;
            if (animations.length > 0) {
                previewImg.style.animation = animations.join(', ');
            }
            if (filters.length > 0) {
                previewImg.style.filter = filters.join(' ');
            }
        }

        function initAnimation(config) {

        function importAnimation() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.html';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const htmlContent = event.target.result;

                    // 從 HTML 註解中提取設定
                    const match = htmlContent.match(/<!-- CONFIG_DATA:([^-]+) -->/);
                    if (!match) {
                        alert('此檔案不包含設定資訊！');
                        return;
                    }

                    try {
                        const configJSON = decodeURIComponent(atob(match[1]));
                        const config = JSON.parse(configJSON);
                        loadConfig(config);
                        alert('匯入成功！');
                    } catch (err) {
                        console.error('匯入錯誤:', err);
                        alert('匯入失敗：' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
