<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Combiner - GIF 疊加合成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
a{color:#a78bfa;text-decoration:none}
header{padding:16px 24px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;gap:16px}
header h1{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.back-link{font-size:0.8rem;color:#666;margin-left:auto}
.back-link:hover{color:#a78bfa}

/* Upload */
#uploadArea{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 24px;cursor:pointer;border:2px dashed #333;margin:32px auto;max-width:480px;border-radius:16px;transition:border-color .2s}
#uploadArea:hover,#uploadArea.dragover{border-color:#a78bfa}
#uploadArea h2{font-size:1.1rem;color:#ccc}
#uploadArea p{font-size:0.85rem;color:#666}
.btn-upload{background:#1e1628;border:1px solid #a78bfa;color:#a78bfa;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:background .2s}
.btn-upload:hover{background:#2a1f38}
#fileInput{display:none}

/* Editor */
#editorSection{display:none;flex-direction:column;flex:1}
.editor-main{display:flex;flex:1;overflow:hidden}

/* Preview */
.preview-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;gap:12px;min-height:300px}
.preview-wrap{position:relative;display:inline-flex}
.preview-wrap::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,#2a2a2a 25%,transparent 25%),linear-gradient(-45deg,#2a2a2a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2a2a 75%),linear-gradient(-45deg,transparent 75%,#2a2a2a 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;border-radius:4px;z-index:0}
#previewCanvas{position:relative;z-index:1;max-width:100%;max-height:calc(100vh - 360px);border-radius:4px;image-rendering:pixelated;cursor:grab}
.preview-info{font-size:0.78rem;color:#555}
.play-bar{display:flex;gap:8px;align-items:center}

/* Layer panel (left) */
.layers-section{width:260px;background:#111;border-right:1px solid #1e1e1e;overflow-y:auto;display:flex;flex-direction:column}
.layers-section::-webkit-scrollbar{width:4px}
.layers-section::-webkit-scrollbar-thumb{background:#333}
.panel-head{padding:12px 14px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:8px}
.panel-head h3{font-size:0.78rem;color:#888;letter-spacing:1px;text-transform:uppercase;flex:1}
#layerList{display:flex;flex-direction:column;padding:8px;gap:6px}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;border:2px solid transparent;background:#161616;cursor:pointer;user-select:none}
.layer-item:hover{background:#1c1c1c}
.layer-item.selected{border-color:#a78bfa;background:#1e1728}
.layer-item canvas{border-radius:4px;flex-shrink:0;background:repeating-conic-gradient(#2a2a2a 0% 25%,#1a1a1a 0% 50%) 50%/10px 10px}
.layer-info{flex:1;min-width:0}
.layer-name{font-size:0.8rem;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-meta{font-size:0.68rem;color:#666}
.layer-actions{display:flex;flex-direction:column;gap:2px}
.layer-actions button{background:none;border:none;color:#888;cursor:pointer;font-size:0.75rem;padding:2px 4px;border-radius:4px}
.layer-actions button:hover:not(:disabled){background:#2a2a2a;color:#fff}
.layer-actions button:disabled{opacity:0.25;cursor:default}
.layer-empty{padding:24px 14px;text-align:center;color:#555;font-size:0.8rem}
.layer-item{cursor:grab}
.layer-item.layer-dragging{opacity:0.35}
.layer-item.layer-drop-target{border-top:2px solid #60a5fa}

/* Controls (right) */
.controls-section{width:300px;background:#111;border-left:1px solid #1e1e1e;overflow-y:auto;display:flex;flex-direction:column}
.controls-section::-webkit-scrollbar{width:4px}
.controls-section::-webkit-scrollbar-thumb{background:#333}
.ctrl-group{padding:16px;border-bottom:1px solid #1a1a1a}
.ctrl-group h3{font-size:0.78rem;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ctrl-row label{font-size:0.8rem;color:#aaa;min-width:52px;flex-shrink:0}
.ctrl-row input[type=number],.ctrl-row input[type=text]{background:#1a1a1a;border:1px solid #2a2a2a;color:#e0e0e0;padding:5px 8px;border-radius:6px;font-size:0.82rem;width:80px}
.ctrl-row input[type=number]:focus,.ctrl-row input[type=text]:focus{outline:none;border-color:#a78bfa}
.ctrl-row input[type=range]{flex:1;accent-color:#a78bfa}
.ctrl-row input[type=color]{background:none;border:none;width:32px;height:28px;padding:0;cursor:pointer;border-radius:4px}
.ctrl-row .val-label{font-size:0.78rem;color:#666;min-width:36px;text-align:right}
.ctrl-row select{background:#1a1a1a;border:1px solid #2a2a2a;color:#e0e0e0;padding:5px 8px;border-radius:6px;font-size:0.82rem;flex:1}
.btn-row{display:flex;gap:6px;margin-top:4px}
.btn{background:#1e1e1e;border:1px solid #2a2a2a;color:#ccc;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:background .15s}
.btn:hover{background:#2a2a2a;color:#fff}
.btn.primary{background:#2a1f38;border-color:#a78bfa;color:#a78bfa}
.btn.primary:hover{background:#3a2f50}
.btn.danger{background:#1e1010;border-color:#ef4444;color:#ef4444}
.btn.danger:hover{background:#2a1010}
.btn.success{background:#0f2420;border-color:#34d399;color:#34d399;padding:10px 20px;font-size:0.9rem;width:100%}
.btn.success:hover{background:#0f3028}
.btn.small{padding:4px 8px;font-size:0.75rem}
.progress{font-size:0.8rem;color:#60a5fa;margin-top:8px;min-height:18px}
.no-selection{padding:24px 14px;text-align:center;color:#555;font-size:0.8rem}

@media(max-width:900px){.editor-main{flex-direction:column}.layers-section,.controls-section{width:100%;border:none;border-top:1px solid #1e1e1e}}
</style>
</head>
<body>

<header>
  <h1>🎨 GIF Combiner</h1>
  <span style="font-size:0.78rem;color:#555">GIF 疊加合成器</span>
  <a class="back-link" href="index.html">← 返回首頁</a>
</header>

<!-- Upload -->
<div id="uploadArea">
  <h2>📂 上傳圖層素材</h2>
  <p>拖曳或點擊選擇 GIF / PNG / JPG / WebP（可多選）</p>
  <label class="btn-upload" for="fileInput">選擇檔案</label>
  <input type="file" id="fileInput" accept="image/gif,image/png,image/jpeg,image/webp" multiple>
</div>

<!-- Editor -->
<div id="editorSection">
  <div class="editor-main">

    <!-- Layers panel -->
    <div class="layers-section">
      <div class="panel-head">
        <h3>圖層</h3>
        <button class="btn small" onclick="fileInput.click()">+ 圖片</button>
        <button class="btn small" onclick="addTextLayer()">+ 文字</button>
        <button class="btn small" onclick="addFilterLayer()">+ 濾鏡</button>
        <button class="btn small" onclick="addParticleLayer()">+ 粒子</button>
      </div>
      <div style="padding:0 8px 8px"><button class="btn small primary" style="width:100%" onclick="applyMemeTemplate()">😂 梗圖範本（上下大白字）</button></div>
      <div id="layerList"></div>
    </div>

    <!-- Preview -->
    <div class="preview-section">
      <div class="preview-wrap"><canvas id="previewCanvas"></canvas></div>
      <div class="play-bar">
        <button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
        <button class="btn small" onclick="stepFrame(-1)">◀</button>
        <button class="btn small" onclick="stepFrame(1)">▶</button>
      </div>
      <div class="preview-info" id="previewInfo"></div>
    </div>

    <!-- Controls -->
    <div class="controls-section" id="controlsSection">
      <div class="no-selection" id="noSelectionMsg">選擇左側圖層以編輯屬性</div>

      <div id="layerProps" style="display:none">
        <div class="ctrl-group" id="transformPropsGroup">
          <h3>位置與大小</h3>
          <div class="ctrl-row">
            <label>X</label>
            <input type="number" id="propX" oninput="updateSelectedLayer()">
            <label style="min-width:20px">Y</label>
            <input type="number" id="propY" oninput="updateSelectedLayer()">
          </div>
          <div class="ctrl-row">
            <label>縮放</label>
            <input type="range" id="propScale" min="0.05" max="4" step="0.01" value="1" oninput="updateSelectedLayer()">
            <span class="val-label" id="propScaleVal">100%</span>
          </div>
          <div class="ctrl-row">
            <label>旋轉</label>
            <input type="range" id="propRotation" min="-180" max="180" step="1" value="0" oninput="updateSelectedLayer()">
            <span class="val-label" id="propRotationVal">0°</span>
          </div>
          <div class="ctrl-row">
            <label>不透</label>
            <input type="range" id="propOpacity" min="0" max="100" step="1" value="100" oninput="updateSelectedLayer()">
            <span class="val-label" id="propOpacityVal">100%</span>
          </div>
        </div>

        <div class="ctrl-group" id="textPropsGroup" style="display:none">
          <h3>文字內容</h3>
          <div class="ctrl-row">
            <textarea id="propText" rows="2" style="flex:1;background:#1a1a1a;border:1px solid #2a2a2a;color:#e0e0e0;border-radius:6px;padding:6px;font-size:0.82rem;resize:vertical" oninput="updateSelectedLayer()"></textarea>
          </div>
          <div class="ctrl-row">
            <label>字體</label>
            <select id="propFontFamily" oninput="updateSelectedLayer()" style="flex:1">
              <option value="'Segoe UI',sans-serif">Segoe UI</option>
              <option value="'Microsoft JhengHei',sans-serif">微軟正黑體</option>
              <option value="Impact,'Arial Black',sans-serif">Impact（梗圖常用）</option>
              <option value="Arial,sans-serif">Arial</option>
              <option value="Georgia,serif">Georgia</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>大小</label>
            <input type="number" id="propFontSize" min="8" max="300" value="40" oninput="updateSelectedLayer()">
            <label style="min-width:30px">粗體</label>
            <input type="checkbox" id="propBold" checked onchange="updateSelectedLayer()">
          </div>
          <div class="ctrl-row">
            <label>顏色</label>
            <input type="color" id="propTextColor" value="#ffffff" oninput="updateSelectedLayer()">
            <label style="min-width:40px">描邊</label>
            <input type="color" id="propStrokeColor" value="#000000" oninput="updateSelectedLayer()">
          </div>
          <div class="ctrl-row">
            <label>描邊寬</label>
            <input type="range" id="propStrokeWidth" min="0" max="20" step="1" value="4" oninput="updateSelectedLayer()">
            <span class="val-label" id="propStrokeWidthVal">4</span>
          </div>
          <div class="ctrl-row">
            <label>陰影</label>
            <input type="checkbox" id="propShadow" onchange="updateSelectedLayer()">
            <label style="min-width:50px">自動換行寬</label>
            <input type="number" id="propWrapWidth" min="0" value="0" title="0 = 不自動換行" oninput="updateSelectedLayer()">
          </div>
          <p style="font-size:0.7rem;color:#555;margin-top:2px">出現幀範圍（依基準 GIF 的幀序號，-1 表示不限制）</p>
          <div class="ctrl-row">
            <label>起</label>
            <input type="number" id="propStartFrame" value="-1" oninput="updateSelectedLayer()">
            <label style="min-width:20px">迄</label>
            <input type="number" id="propEndFrame" value="-1" oninput="updateSelectedLayer()">
          </div>
        </div>

        <div class="ctrl-group" id="filterPropsGroup" style="display:none">
          <h3>濾鏡調整（影響下方所有圖層）</h3>
          <div class="ctrl-row">
            <label>亮度</label>
            <input type="range" id="propBrightness" min="0" max="200" step="1" value="100" oninput="updateSelectedLayer()">
            <span class="val-label" id="propBrightnessVal">100%</span>
          </div>
          <div class="ctrl-row">
            <label>對比</label>
            <input type="range" id="propContrast" min="0" max="200" step="1" value="100" oninput="updateSelectedLayer()">
            <span class="val-label" id="propContrastVal">100%</span>
          </div>
          <div class="ctrl-row">
            <label>色相</label>
            <input type="range" id="propHue" min="-180" max="180" step="1" value="0" oninput="updateSelectedLayer()">
            <span class="val-label" id="propHueVal">0°</span>
          </div>
          <div class="ctrl-row">
            <label>飽和度</label>
            <input type="range" id="propSaturate" min="0" max="200" step="1" value="100" oninput="updateSelectedLayer()">
            <span class="val-label" id="propSaturateVal">100%</span>
          </div>
        </div>

        <div class="ctrl-group" id="particlePropsGroup" style="display:none">
          <h3>粒子效果（全畫布）</h3>
          <div class="ctrl-row">
            <label>類型</label>
            <select id="propParticleType" onchange="updateSelectedLayer(true)" style="flex:1">
              <option value="snow">❄ 下雪</option>
              <option value="heart">❤ 愛心</option>
              <option value="star">⭐ 星星</option>
              <option value="bubble">🫧 泡泡</option>
              <option value="sakura">🌸 櫻花</option>
              <option value="sparkle">✨ 閃光</option>
              <option value="firefly">🌟 螢火蟲</option>
              <option value="confetti">🎊 彩紙</option>
              <option value="leaf1">🍂 落葉</option>
              <option value="leaf2">🍁 楓葉</option>
              <option value="leaf3">🍃 風葉</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>速度</label>
            <input type="range" id="propParticleSpeed" min="0" max="0.5" step="0.01" value="0.1" oninput="updateSelectedLayer()">
            <span class="val-label" id="propParticleSpeedVal">0.1</span>
          </div>
        </div>

        <div class="ctrl-group" id="keyColorGroup">
          <h3>去背色</h3>
          <div class="ctrl-row">
            <label>啟用</label>
            <input type="checkbox" id="propKeyEnabled" onchange="updateSelectedLayer()">
            <input type="color" id="propKeyColor" value="#00ff00" oninput="updateSelectedLayer()">
            <button class="btn small" id="btnEyedropper" onclick="startEyedropper()">🎯 滴管</button>
          </div>
          <div class="ctrl-row">
            <label>容許值</label>
            <input type="range" id="propKeyTolerance" min="0" max="100" step="1" value="30" oninput="updateSelectedLayer()">
            <span class="val-label" id="propKeyToleranceVal">30</span>
          </div>
        </div>

        <div class="ctrl-group" id="blendPropsGroup">
          <h3>混合模式</h3>
          <div class="ctrl-row">
            <select id="propBlend" onchange="updateSelectedLayer()">
              <option value="source-over">正常 Normal</option>
              <option value="screen">變亮 Screen</option>
              <option value="multiply">色彩增值 Multiply</option>
            </select>
          </div>
        </div>

        <div class="ctrl-group">
          <h3>圖層操作</h3>
          <div class="btn-row">
            <button class="btn small" onclick="moveLayer(1)">↑ 上移</button>
            <button class="btn small" onclick="moveLayer(-1)">↓ 下移</button>
            <button class="btn small danger" onclick="deleteSelectedLayer()">刪除</button>
          </div>
        </div>
      </div>

      <div class="ctrl-group">
        <h3>畫布尺寸</h3>
        <div class="ctrl-row">
          <label>寬</label>
          <input type="number" id="canvasW" min="1" max="2000" oninput="resizeCanvasSetting()">
          <label style="min-width:20px">高</label>
          <input type="number" id="canvasH" min="1" max="2000" oninput="resizeCanvasSetting()">
        </div>
      </div>

      <div class="ctrl-group">
        <h3>匯出</h3>
        <div class="ctrl-row">
          <label>品質</label>
          <input type="range" id="outQuality" min="1" max="20" value="10" oninput="document.getElementById('outQualityVal').textContent=this.value">
          <span class="val-label" id="outQualityVal">10</span>
        </div>
        <p style="font-size:0.72rem;color:#555;margin-bottom:10px">品質數值越低越好，建議 1–10</p>
        <button class="btn success" id="btnExport" onclick="exportGIF()">🔴 匯出 GIF</button>
        <div class="progress" id="exportProgress"></div>
      </div>

    </div>
  </div>
</div>

<script>
// (c) Dean McNamee <dean@gmail.com>, 2013.
//
// https://github.com/deanm/omggif

// FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS
// IN THE SOFTWARE.
//
// omggif is a JavaScript implementation of a GIF 89a encoder and decoder,
// including animation and compression.  It does not rely on any specific
// underlying system, so should run in the browser, Node, or Plask.

"use strict";

function GifWriter(buf, width, height, gopts) {
  var p = 0;

  var gopts = gopts === undefined ? { } : gopts;
  var loop_count = gopts.loop === undefined ? null : gopts.loop;
  var global_palette = gopts.palette === undefined ? null : gopts.palette;

  if (width <= 0 || height <= 0 || width > 65535 || height > 65535)
    throw new Error("Width/Height invalid.");

  function check_palette_and_num_colors(palette) {
    var num_colors = palette.length;
    if (num_colors < 2 || num_colors > 256 ||  num_colors & (num_colors-1)) {
      throw new Error(
          "Invalid code/color length, must be power of 2 and 2 .. 256.");
    }
    return num_colors;
  }

  // - Header.
  buf[p++] = 0x47; buf[p++] = 0x49; buf[p++] = 0x46;  // GIF
  buf[p++] = 0x38; buf[p++] = 0x39; buf[p++] = 0x61;  // 89a

  // Handling of Global Color Table (palette) and background index.
  var gp_num_colors_pow2 = 0;
  var background = 0;
  if (global_palette !== null) {
    var gp_num_colors = check_palette_and_num_colors(global_palette);
    while (gp_num_colors >>= 1) ++gp_num_colors_pow2;
    gp_num_colors = 1 << gp_num_colors_pow2;
    --gp_num_colors_pow2;
    if (gopts.background !== undefined) {
      background = gopts.background;
      if (background >= gp_num_colors)
        throw new Error("Background index out of range.");
      // The GIF spec states that a background index of 0 should be ignored, so
      // this is probably a mistake and you really want to set it to another
      // slot in the palette.  But actually in the end most browsers, etc end
      // up ignoring this almost completely (including for dispose background).
      if (background === 0)
        throw new Error("Background index explicitly passed as 0.");
    }
  }

  // - Logical Screen Descriptor.
  // NOTE(deanm): w/h apparently ignored by implementations, but set anyway.
  buf[p++] = width & 0xff; buf[p++] = width >> 8 & 0xff;
  buf[p++] = height & 0xff; buf[p++] = height >> 8 & 0xff;
  // NOTE: Indicates 0-bpp original color resolution (unused?).
  buf[p++] = (global_palette !== null ? 0x80 : 0) |  // Global Color Table Flag.
             gp_num_colors_pow2;  // NOTE: No sort flag (unused?).
  buf[p++] = background;  // Background Color Index.
  buf[p++] = 0;  // Pixel aspect ratio (unused?).

  // - Global Color Table
  if (global_palette !== null) {
    for (var i = 0, il = global_palette.length; i < il; ++i) {
      var rgb = global_palette[i];
      buf[p++] = rgb >> 16 & 0xff;
      buf[p++] = rgb >> 8 & 0xff;
      buf[p++] = rgb & 0xff;
    }
  }

  if (loop_count !== null) {  // Netscape block for looping.
    if (loop_count < 0 || loop_count > 65535)
      throw new Error("Loop count invalid.")
    // Extension code, label, and length.
    buf[p++] = 0x21; buf[p++] = 0xff; buf[p++] = 0x0b;
    // NETSCAPE2.0
    buf[p++] = 0x4e; buf[p++] = 0x45; buf[p++] = 0x54; buf[p++] = 0x53;
    buf[p++] = 0x43; buf[p++] = 0x41; buf[p++] = 0x50; buf[p++] = 0x45;
    buf[p++] = 0x32; buf[p++] = 0x2e; buf[p++] = 0x30;
    // Sub-block
    buf[p++] = 0x03; buf[p++] = 0x01;
    buf[p++] = loop_count & 0xff; buf[p++] = loop_count >> 8 & 0xff;
    buf[p++] = 0x00;  // Terminator.
  }


  var ended = false;

  this.addFrame = function(x, y, w, h, indexed_pixels, opts) {
    if (ended === true) { --p; ended = false; }  // Un-end.

    opts = opts === undefined ? { } : opts;

    // TODO(deanm): Bounds check x, y.  Do they need to be within the virtual
    // canvas width/height, I imagine?
    if (x < 0 || y < 0 || x > 65535 || y > 65535)
      throw new Error("x/y invalid.")

    if (w <= 0 || h <= 0 || w > 65535 || h > 65535)
      throw new Error("Width/Height invalid.")

    if (indexed_pixels.length < w * h)
      throw new Error("Not enough pixels for the frame size.");

    var using_local_palette = true;
    var palette = opts.palette;
    if (palette === undefined || palette === null) {
      using_local_palette = false;
      palette = global_palette;

<script>
// ── State ──────────────────────────────────────────
// layer: { id, name, type:'gif'|'image', frames:[{canvas,delay}], srcW, srcH,
//          x, y, scale, rotation, opacity, blend, keyColor, keyTolerance }
let layers = [];
let selectedLayerId = -1;
let nextLayerId = 1;
let canvasW = 480, canvasH = 480;
let isPlaying = false, playTimer = null, playLastTick = 0;
let currentTimeMs = 0; // 播放時間軸（毫秒），取代原本簡單的幀計數
const TICK_MS = 20; // 播放時鐘更新間隔，實際畫面依各圖層 delay 對齊，不是每個 tick 都換幀

const PARTICLE_EMOJI = { snow: '❄', heart: '❤', star: '⭐', bubble: '🫧', sakura: '🌸', sparkle: '✨', firefly: '🌟', confetti: '🎊', leaf1: '🍂', leaf2: '🍁', leaf3: '🍃' };
const PARTICLE_NAMES = { snow: '下雪', heart: '愛心', star: '星星', bubble: '泡泡', sakura: '櫻花', sparkle: '閃光', firefly: '螢火蟲', confetti: '彩紙', leaf1: '落葉', leaf2: '楓葉', leaf3: '風葉' };
const LEAF_TYPES = ['leaf1', 'leaf2', 'leaf3'];

// ── 時間軸對齊：以幀數最多的動態圖層為基準，其餘圖層依時間換算應顯示第幾幀 ──
function computeMasterTimeline() {
    const dynamicLayers = layers.filter(l => l.frames && l.frames.length > 1);
    if (dynamicLayers.length === 0) return null;
    let base = dynamicLayers[0];
    for (const l of dynamicLayers) if (l.frames.length > base.frames.length) base = l;
    let t = 0;
    const starts = [];
    for (const f of base.frames) { starts.push(t); t += f.delay; }
    return { base, starts, totalDuration: t };
}

function layerFrameIndexAtTime(layer, timeMs) {
    if (layer.frames.length <= 1) return 0;
    const total = layer.frames.reduce((s, f) => s + f.delay, 0);
    if (total <= 0) return 0;
    const tm = ((timeMs % total) + total) % total;
    let acc = 0;
    for (let i = 0; i < layer.frames.length; i++) {
        acc += layer.frames[i].delay;
        if (tm < acc) return i;
    }
    return layer.frames.length - 1;
}

const previewCanvas = document.getElementById('previewCanvas');
const previewCtx = previewCanvas.getContext('2d');
const uploadArea = document.getElementById('uploadArea');
const fileInput  = document.getElementById('fileInput');

uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
});
uploadArea.addEventListener('click', e => { if (e.target !== document.querySelector('.btn-upload')) fileInput.click(); });
fileInput.addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });

// ── File handling ──────────────────────────────────
async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f =>
        ['image/gif', 'image/png', 'image/jpeg', 'image/webp'].includes(f.type));
    if (files.length === 0) return;

    for (const file of files) {
        try {
            if (file.type === 'image/gif') {
                await addGifLayer(file);
            } else {
                await addImageLayer(file);
            }
        } catch (err) {
            alert('無法載入「' + file.name + '」：' + (err.message || err));
        }
    }

    if (layers.length > 0) {
        uploadArea.style.display = 'none';
        document.getElementById('editorSection').style.display = 'flex';
        if (layers.length === files.length) {
            // 第一次上傳：以第一個圖層尺寸做為畫布預設大小
            canvasW = layers[0].srcW;
            canvasH = layers[0].srcH;
            document.getElementById('canvasW').value = canvasW;
            document.getElementById('canvasH').value = canvasH;
        }
        selectLayer(layers[layers.length - 1].id);
        renderLayerList();
        renderPreview();

        // 有動態圖層（GIF）時自動開始播放預覽，使用者不用手動按播放才看得到動畫
        if (!isPlaying && computeMasterTimeline()) togglePlay();
    }
}

async function addGifLayer(file) {
    const buf = await file.arrayBuffer();
    const gr = new GifReader(new Uint8Array(buf));
    const W = gr.width, H = gr.height;
    const compositePixels = new Uint8ClampedArray(W * H * 4);
    const savedPixels     = new Uint8ClampedArray(W * H * 4);
    const n = gr.numFrames();
    const frames = [];

    for (let i = 0; i < n; i++) {
        const info = gr.frameInfo(i);
        if (i > 0) {
            const prev = gr.frameInfo(i - 1);
            if (prev.disposal === 2) {
                for (let py = prev.y; py < prev.y + prev.height; py++) {
                    const s = (py * W + prev.x) * 4;
                    compositePixels.fill(0, s, s + prev.width * 4);
                }
            } else if (prev.disposal === 3) {
                compositePixels.set(savedPixels);
            }
        }
        if (info.disposal === 3) savedPixels.set(compositePixels);
        gr.decodeAndBlitFrameRGBA(i, compositePixels);

        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        c.getContext('2d').putImageData(
            new ImageData(new Uint8ClampedArray(compositePixels), W, H), 0, 0
        );
        frames.push({ canvas: c, delay: Math.max((info.delay || 10) * 10, 1) });
    }

    layers.push({
        id: nextLayerId++, name: file.name, type: 'gif',
        frames, srcW: W, srcH: H,
        x: 0, y: 0, scale: 1, rotation: 0, opacity: 100,
        blend: 'source-over', keyColor: null, keyTolerance: 30
    });
}

function addImageLayer(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            layers.push({
                id: nextLayerId++, name: file.name, type: 'image',
                frames: [{ canvas: c, delay: 100 }], srcW: img.width, srcH: img.height,
                x: 0, y: 0, scale: 1, rotation: 0, opacity: 100,
                blend: 'source-over', keyColor: null, keyTolerance: 30
            });
            resolve();
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片載入失敗')); };
        img.src = url;
    });
}

// ── 文字圖層 ────────────────────────────────────────
function makeTextLayerBase(overrides) {
    const layer = Object.assign({
        id: nextLayerId++, name: '文字圖層', type: 'text',
        text: '在此輸入文字', fontFamily: "'Segoe UI',sans-serif", fontSize: 40, bold: true,
        textColor: '#ffffff', strokeColor: '#000000', strokeWidth: 4, shadow: false, wrapWidth: 0,
        startFrame: -1, endFrame: -1,
        x: 0, y: 0, scale: 1, rotation: 0, opacity: 100, blend: 'source-over',
        keyColor: null, keyTolerance: 30, frames: null
    }, overrides);
    updateTextLayerMetrics(layer);
    return layer;
}

function addTextLayer() {
    const layer = makeTextLayerBase({});
    layer.x = Math.round((canvasW - layer.srcW) / 2);

    selectLayer(layer.id);

}

// ── 粒子圖層：移植自 PhysicsGIF_Studio.html 的粒子系統，改成純時間函式 ──
// （位置只由 currentTimeMs 算出，不會逐幀累加狀態，這樣匯出 GIF 時任意時間點重算都會得到同一個結果）
function addParticleLayer() {
    const layer = {
        id: nextLayerId++, name: '粒子圖層', type: 'particle',
        particleType: 'snow', particleSpeed: 0.1, particles: [],
        x: 0, y: 0, scale: 1, rotation: 0, opacity: 100, blend: 'source-over',
        keyColor: null, keyTolerance: 30, frames: null
    };
    initLayerParticles(layer);
    layers.push(layer);
    uploadArea.style.display = 'none';
    document.getElementById('editorSection').style.display = 'flex';
    selectLayer(layer.id);
    renderLayerList();
    renderPreview();

function initLayerParticles(layer) {
    const type = layer.particleType;
    const count = type === 'sparkle' ? 30 : (type === 'confetti' ? 150 : 15);
    const useGrid = ['heart', 'star', 'sparkle'].includes(type);
    const particles = [];

    if (useGrid) {
        const cols = Math.ceil(Math.sqrt(count * (canvasW / canvasH)));
        const rows = Math.ceil(count / cols);
        const cellW = canvasW / cols;
        const cellH = canvasH / rows;
        let idx = 0;
        for (let row = 0; row < rows && idx < count; row++) {
            for (let col = 0; col < cols && idx < count; col++) {
                const offsetX = (Math.random() - 0.5) * cellW * 0.6;
                const offsetY = (Math.random() - 0.5) * cellH * 0.6;
                particles.push({
                    startX: col * cellW + cellW / 2 + offsetX,
                    startY: row * cellH + cellH / 2 + offsetY,
                    s: Math.random() * 0.5 + 0.6, v: Math.random() * 2 + 1, o: Math.random() * Math.PI * 2,
                    vx: (Math.random() - 0.5) * 2, rotSpeed: (Math.random() - 0.5) * 5,
                    color: 'hsl(' + Math.random() * 360 + ', 70%, 60%)', offset: Math.random() * 1000
                });
                idx++;
            }
        }
    } else {
        for (let i = 0; i < count; i++) {
            particles.push({
                startX: Math.random() * canvasW, startY: Math.random() * canvasH,
                s: Math.random() * 0.5 + 0.5, v: Math.random() * 2 + 1, o: Math.random() * Math.PI * 2,
                vx: (Math.random() - 0.5) * 2, rotSpeed: (Math.random() - 0.5) * 5,
                color: 'hsl(' + Math.random() * 360 + ', 70%, 60%)', offset: Math.random() * 1000
            });
        }
    }
    layer.particles = particles;
}

function drawParticleLayer(ctx, layer, timeMs) {
    const type = layer.particleType;
    const cycleHeight = canvasH + 60;
    const cycleWidth = canvasW + 60;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(100, layer.opacity)) / 100;
    ctx.globalCompositeOperation = layer.blend || 'source-over';

    layer.particles.forEach(p => {
        const t = (timeMs * layer.particleSpeed) + p.offset;
        let x, y, rot = 0;

        if (type === 'bubble') {
            const movement = (t * p.v * 0.5) % cycleHeight;
            y = (p.startY - movement + cycleHeight) % cycleHeight - 30;
            x = p.startX + Math.sin(t * 0.05 + p.o) * 30;
            x = ((x % cycleWidth) + cycleWidth) % cycleWidth - 30;
        } else if (type === 'sakura' || LEAF_TYPES.includes(type)) {
            const movement = (t * p.v * 0.8) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            x = p.startX + Math.sin(t * 0.03 + p.o) * 50;
            x = ((x % cycleWidth) + cycleWidth) % cycleWidth - 30;
            rot = t * p.rotSpeed;
        } else if (type === 'firefly') {
            y = canvasH / 2 + Math.sin(t * 0.05 + p.o) * (canvasH * 0.4);
            x = canvasW / 2 + Math.cos(t * 0.05 + p.o) * (canvasW * 0.4);
        } else if (type === 'confetti') {
            const movement = (t * p.v) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            const xMovement = (t * p.vx) % cycleWidth;
            x = (p.startX + xMovement + cycleWidth) % cycleWidth - 30;
            rot = t * p.rotSpeed;
        } else if (type === 'heart' || type === 'star' || type === 'sparkle') {
            x = p.startX; y = p.startY;
        } else {
            const movement = (t * p.v) % cycleHeight;
            y = (p.startY + movement) % cycleHeight - 30;
            x = p.startX;
        }

        ctx.save();
        ctx.translate(x, y);
        if (type === 'sakura' || type === 'confetti' || LEAF_TYPES.includes(type)) ctx.rotate(rot * Math.PI / 180);

        if (type === 'heart' || type === 'star' || type === 'sparkle') {
            const pulseScale = p.s * (0.8 + Math.abs(Math.sin(t * 0.1 + p.o)) * 0.5);
            ctx.scale(pulseScale, pulseScale);
        } else {
            ctx.scale(p.s, p.s);
        }

        if (type === 'snow') {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
        } else if (type === 'heart') {
            ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
            ctx.font = '30px Arial'; ctx.textAlign = 'center';
            ctx.fillText('❤', 0, 0);
        } else if (type === 'star') {
            ctx.fillStyle = 'rgba(255, 255, 100, ' + Math.abs(Math.sin(timeMs * 0.1 + p.o)) + ')';
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        } else if (type === 'bubble') {
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fill();
        } else if (type === 'sakura') {
            ctx.fillStyle = 'rgba(255, 182, 193, 0.8)';
            ctx.font = '25px Arial'; ctx.textAlign = 'center';
            ctx.fillText('🌸', 0, 0);
        } else if (LEAF_TYPES.includes(type)) {
            ctx.font = '24px Arial'; ctx.textAlign = 'center';
            ctx.fillText(PARTICLE_EMOJI[type], 0, 0);
        } else if (type === 'sparkle') {
            const alpha = Math.abs(Math.sin(timeMs * 0.15 + p.o));
            ctx.beginPath();
            ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha + ')';
            ctx.stroke();
        } else if (type === 'firefly') {
            const alpha = Math.abs(Math.sin(timeMs * 0.2 + p.o));
            ctx.fillStyle = 'rgba(255, 255, 100, ' + alpha + ')';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 255, 100, ' + alpha + ')';
            ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
        } else if (type === 'confetti') {
            ctx.fillStyle = p.color;
            ctx.fillRect(-4, -8, 8, 16);
        }

        ctx.restore();
    });

    ctx.restore();
}

// 梗圖範本：畫布上方＋下方各放一個「大白字＋黑邊」文字圖層，套用經典排版
function applyMemeTemplate() {
    const fontSize = Math.max(20, Math.round(canvasH * 0.11));
    const memeStyle = {
        fontFamily: "Impact,'Arial Black',sans-serif", fontSize,
        bold: true, textColor: '#ffffff', strokeColor: '#000000', strokeWidth: Math.max(2, Math.round(fontSize / 12)),
        shadow: false, wrapWidth: Math.round(canvasW * 0.92), scale: 1, opacity: 100,
        blend: 'source-over', rotation: 0
    };

    let top = layers.find(l => l.type === 'text' && l.name === '上方文字');
    if (!top) { top = makeTextLayerBase({ name: '上方文字', text: '上方文字' }); layers.push(top); }
    Object.assign(top, memeStyle, { text: top.text || '上方文字' });
    updateTextLayerMetrics(top);
    top.x = Math.round((canvasW - top.srcW) / 2);
    top.y = Math.round(canvasH * 0.04);

    let bottom = layers.find(l => l.type === 'text' && l.name === '下方文字');
    if (!bottom) { bottom = makeTextLayerBase({ name: '下方文字', text: '下方文字' }); layers.push(bottom); }
    Object.assign(bottom, memeStyle, { text: bottom.text || '下方文字' });
    updateTextLayerMetrics(bottom);
    bottom.x = Math.round((canvasW - bottom.srcW) / 2);
    bottom.y = Math.round(canvasH * 0.96 - bottom.srcH);

    document.getElementById('editorSection').style.display = 'flex';
    uploadArea.style.display = 'none';
    selectLayer(top.id);
    renderLayerList();
    renderPreview();
}

// 依目前文字設定重新量測文字框大小（自動換行 + 自動置中的依據）
function updateTextLayerMetrics(layer) {
    const ctx = previewCtx;
    ctx.font = (layer.bold ? 'bold ' : '') + layer.fontSize + 'px ' + layer.fontFamily;
    const wrapWidth = layer.wrapWidth > 0 ? layer.wrapWidth : Infinity;
    const paragraphs = (layer.text || '').split('\n');
    const lines = [];
    for (const para of paragraphs) {
        if (para === '') { lines.push(''); continue; }
        const words = para.split(' ');
        let line = '';
        for (const word of words) {
            const test = line ? line + ' ' + word : word;
            if (wrapWidth !== Infinity && ctx.measureText(test).width > wrapWidth && line) {
                lines.push(line); line = word;
            } else {
                line = test;
            }
        }
        lines.push(line);
    }
    let maxW = 1;
    for (const l of lines) maxW = Math.max(maxW, ctx.measureText(l).width);
    const lineHeight = layer.fontSize * 1.2;
    layer._textLines = lines;
    layer.srcW = Math.max(1, Math.ceil(maxW));
    layer.srcH = Math.max(1, Math.ceil(lines.length * lineHeight));
}

function drawTextLayer(ctx, layer) {
    const { w, h, cx, cy } = layerGeom(layer);
    const effFontSize = layer.fontSize * layer.scale;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(100, layer.opacity)) / 100;
    ctx.globalCompositeOperation = layer.blend || 'source-over';
    ctx.translate(cx, cy);
    ctx.rotate(layer.rotation * Math.PI / 180);
    ctx.font = (layer.bold ? 'bold ' : '') + effFontSize + 'px ' + layer.fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (layer.shadow) {
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = effFontSize * 0.15;
        ctx.shadowOffsetX = effFontSize * 0.05;
        ctx.shadowOffsetY = effFontSize * 0.05;
    }
    const lines = (layer._textLines && layer._textLines.length) ? layer._textLines : [''];
    const lineHeight = effFontSize * 1.2;
    const totalH = lines.length * lineHeight;
    lines.forEach((line, i) => {
        const ly = -totalH / 2 + lineHeight * (i + 0.5);
        if (layer.strokeWidth > 0) {
            ctx.lineWidth = layer.strokeWidth * layer.scale;
            ctx.strokeStyle = layer.strokeColor;
            ctx.lineJoin = 'round';
            ctx.strokeText(line, 0, ly);
        }
        ctx.fillStyle = layer.textColor;
        ctx.fillText(line, 0, ly);
    });
    ctx.restore();
}

// ── Layer list panel ───────────────────────────────
function renderLayerList() {
    const list = document.getElementById('layerList');
    list.innerHTML = '';
    if (layers.length === 0) {
        list.innerHTML = '<div class="layer-empty">尚無圖層，請上傳素材</div>';
        return;
    }
    // 由上到下顯示：陣列尾端（最上層）先列出
    for (let i = layers.length - 1; i >= 0; i--) {
        const layer = layers[i];
        const div = document.createElement('div');
        div.className = 'layer-item' + (layer.id === selectedLayerId ? ' selected' : '');

        const th = document.createElement('canvas');
        const THUMB = 40;
        if (layer.type === 'text') {
            th.width = THUMB; th.height = THUMB;
            const tctx = th.getContext('2d');
            tctx.fillStyle = '#000'; tctx.fillRect(0, 0, THUMB, THUMB);
            tctx.fillStyle = '#fff'; tctx.font = 'bold 14px sans-serif';
            tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
            tctx.fillText('Aa', THUMB / 2, THUMB / 2);
        } else if (layer.type === 'filter') {
            th.width = THUMB; th.height = THUMB;
            const fctx = th.getContext('2d');
            const grad = fctx.createLinearGradient(0, 0, THUMB, THUMB);
            grad.addColorStop(0, '#f43f5e'); grad.addColorStop(0.5, '#a78bfa'); grad.addColorStop(1, '#34d399');
            fctx.fillStyle = grad; fctx.fillRect(0, 0, THUMB, THUMB);
            fctx.fillStyle = '#fff'; fctx.font = '18px sans-serif';
            fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
            fctx.fillText('🎛', THUMB / 2, THUMB / 2);
        } else if (layer.type === 'particle') {
            th.width = THUMB; th.height = THUMB;
            const pctx = th.getContext('2d');
            pctx.fillStyle = '#0d1520'; pctx.fillRect(0, 0, THUMB, THUMB);
            pctx.font = '20px sans-serif';
            pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
            pctx.fillText(PARTICLE_EMOJI[layer.particleType] || '✨', THUMB / 2, THUMB / 2);
        } else {
            const ratio = layer.srcH / layer.srcW;
            th.width = THUMB; th.height = Math.round(THUMB * ratio) || THUMB;
            th.getContext('2d').drawImage(layer.frames[0].canvas, 0, 0, th.width, th.height);
        }

        const info = document.createElement('div');
        info.className = 'layer-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'layer-name';
        const icon = layer.type === 'gif' ? '🎞 ' : layer.type === 'text' ? '🅰 ' : layer.type === 'filter' ? '🎛 ' : layer.type === 'particle' ? (PARTICLE_EMOJI[layer.particleType] || '✨') + ' ' : '🖼 ';
        nameEl.textContent = icon + layer.name;
        const metaEl = document.createElement('div');
        metaEl.className = 'layer-meta';
        metaEl.textContent = layer.type === 'gif'
            ? layer.frames.length + ' 幀 · ' + layer.srcW + '×' + layer.srcH
            : layer.type === 'filter'
            ? '影響下方圖層'
            : layer.type === 'particle'
            ? PARTICLE_NAMES[layer.particleType] + ' · 全畫布'
            : layer.srcW + '×' + layer.srcH;
        info.appendChild(nameEl); info.appendChild(metaEl);

        const actions = document.createElement('div');
        actions.className = 'layer-actions';
        const upBtn = document.createElement('button');
        upBtn.textContent = '▲';
        upBtn.title = '上移（往上層）';
        upBtn.disabled = i === layers.length - 1;
        upBtn.addEventListener('click', ev => { ev.stopPropagation(); moveLayerById(layer.id, 1); });
        const downBtn = document.createElement('button');
        downBtn.textContent = '▼';
        downBtn.title = '下移（往下層）';
        downBtn.disabled = i === 0;
        downBtn.addEventListener('click', ev => { ev.stopPropagation(); moveLayerById(layer.id, -1); });
        actions.appendChild(upBtn);
        actions.appendChild(downBtn);

        div.appendChild(th);
        div.appendChild(info);
        div.appendChild(actions);
        div.addEventListener('click', () => selectLayer(layer.id));

        // 滑鼠拖曳排序
        div.draggable = true;
        div.dataset.layerId = layer.id;
        div.addEventListener('dragstart', e => {
            layerDragSrcId = layer.id;
            div.classList.add('layer-dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        div.addEventListener('dragend', () => {
            div.classList.remove('layer-dragging');
            list.querySelectorAll('.layer-drop-target').forEach(el => el.classList.remove('layer-drop-target'));
        });
        div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('layer-drop-target'); });
        div.addEventListener('dragleave', () => div.classList.remove('layer-drop-target'));
        div.addEventListener('drop', e => {
            e.preventDefault();
            div.classList.remove('layer-drop-target');
            if (layerDragSrcId !== null && layerDragSrcId !== layer.id) reorderLayerByDrop(layerDragSrcId, layer.id);
        });

        list.appendChild(div);
    }
}

let layerDragSrcId = null;

function moveLayerById(id, dir) {
    const i = layers.findIndex(l => l.id === id);
    if (i < 0) return;
    const j = i + dir;
    if (j < 0 || j >= layers.length) return;
    [layers[i], layers[j]] = [layers[j], layers[i]];
    renderLayerList();
    renderPreview();
}

function reorderLayerByDrop(srcId, targetId) {
    const srcIdx = layers.findIndex(l => l.id === srcId);
    if (srcIdx < 0) return;
    const [item] = layers.splice(srcIdx, 1);
    const targetIdx = layers.findIndex(l => l.id === targetId);
    layers.splice(targetIdx < 0 ? layers.length : targetIdx, 0, item);
    renderLayerList();
    renderPreview();
}

function selectLayer(id) {
    selectedLayerId = id;
    renderLayerList();
    const layer = layers.find(l => l.id === id);
    const propsEl = document.getElementById('layerProps');
    const noSelEl = document.getElementById('noSelectionMsg');
    if (!layer) { propsEl.style.display = 'none'; noSelEl.style.display = 'block'; return; }
    propsEl.style.display = 'block';
    noSelEl.style.display = 'none';

    document.getElementById('propX').value = layer.x;
    document.getElementById('propY').value = layer.y;
    document.getElementById('propScale').value = layer.scale;
    document.getElementById('propScaleVal').textContent = Math.round(layer.scale * 100) + '%';
    document.getElementById('propRotation').value = layer.rotation;
    document.getElementById('propRotationVal').textContent = layer.rotation + '°';
    document.getElementById('propOpacity').value = layer.opacity;
    document.getElementById('propOpacityVal').textContent = layer.opacity + '%';

    document.getElementById('propKeyEnabled').checked = !!layer.keyColor;
    document.getElementById('propKeyColor').value = layer.keyColor || '#00ff00';
    document.getElementById('propKeyTolerance').value = layer.keyTolerance;
    document.getElementById('propKeyToleranceVal').textContent = layer.keyTolerance;
    document.getElementById('propBlend').value = layer.blend;

    const isText = layer.type === 'text';
    const isFilter = layer.type === 'filter';
    const isParticle = layer.type === 'particle';
    document.getElementById('textPropsGroup').style.display = isText ? 'block' : 'none';
    document.getElementById('filterPropsGroup').style.display = isFilter ? 'block' : 'none';
    document.getElementById('particlePropsGroup').style.display = isParticle ? 'block' : 'none';
    document.getElementById('keyColorGroup').style.display = (isText || isFilter || isParticle) ? 'none' : 'block';
    document.getElementById('transformPropsGroup').style.display = (isFilter || isParticle) ? 'none' : 'block';
    document.getElementById('blendPropsGroup').style.display = isFilter ? 'none' : 'block';
    if (isText) {
        document.getElementById('propText').value = layer.text;
        document.getElementById('propFontFamily').value = layer.fontFamily;
        document.getElementById('propFontSize').value = layer.fontSize;
        document.getElementById('propBold').checked = layer.bold;
        document.getElementById('propTextColor').value = layer.textColor;
        document.getElementById('propStrokeColor').value = layer.strokeColor;
        document.getElementById('propStrokeWidth').value = layer.strokeWidth;
        document.getElementById('propStrokeWidthVal').textContent = layer.strokeWidth;
        document.getElementById('propShadow').checked = layer.shadow;
        document.getElementById('propWrapWidth').value = layer.wrapWidth;
        document.getElementById('propStartFrame').value = layer.startFrame;
        document.getElementById('propEndFrame').value = layer.endFrame;
    }
    if (isFilter) {
        document.getElementById('propBrightness').value = layer.brightness;
        document.getElementById('propBrightnessVal').textContent = layer.brightness + '%';
        document.getElementById('propContrast').value = layer.contrast;
        document.getElementById('propContrastVal').textContent = layer.contrast + '%';
        document.getElementById('propHue').value = layer.hue;
        document.getElementById('propHueVal').textContent = layer.hue + '°';
        document.getElementById('propSaturate').value = layer.saturate;
        document.getElementById('propSaturateVal').textContent = layer.saturate + '%';
    }
    if (isParticle) {
        document.getElementById('propParticleType').value = layer.particleType;
        document.getElementById('propParticleSpeed').value = layer.particleSpeed;
        document.getElementById('propParticleSpeedVal').textContent = layer.particleSpeed;
    }
}

function updateSelectedLayer(regenParticles) {
    const layer = layers.find(l => l.id === selectedLayerId);
    if (!layer) return;

    if (layer.type === 'filter') {
        layer.brightness = parseFloat(document.getElementById('propBrightness').value) || 0;
        layer.contrast = parseFloat(document.getElementById('propContrast').value) || 0;
        layer.hue = parseFloat(document.getElementById('propHue').value) || 0;
        layer.saturate = parseFloat(document.getElementById('propSaturate').value) || 0;
        document.getElementById('propBrightnessVal').textContent = layer.brightness + '%';
        document.getElementById('propContrastVal').textContent = layer.contrast + '%';
        document.getElementById('propHueVal').textContent = layer.hue + '°';
        document.getElementById('propSaturateVal').textContent = layer.saturate + '%';
        renderLayerList();
        renderPreview();
        return;
    }

    if (layer.type === 'particle') {
        const newType = document.getElementById('propParticleType').value;
        if (regenParticles || newType !== layer.particleType) {
            layer.particleType = newType;
            initLayerParticles(layer);
        }
        layer.particleSpeed = parseFloat(document.getElementById('propParticleSpeed').value) || 0;
        document.getElementById('propParticleSpeedVal').textContent = layer.particleSpeed;
        layer.blend = document.getElementById('propBlend').value;
        renderLayerList();
        renderPreview();
        return;
    }

    layer.x = parseFloat(document.getElementById('propX').value) || 0;
    layer.y = parseFloat(document.getElementById('propY').value) || 0;
    layer.scale = parseFloat(document.getElementById('propScale').value) || 1;
    layer.rotation = parseFloat(document.getElementById('propRotation').value) || 0;
    layer.opacity = parseFloat(document.getElementById('propOpacity').value);

    const keyEnabled = document.getElementById('propKeyEnabled').checked;
    layer.keyColor = keyEnabled ? document.getElementById('propKeyColor').value : null;
    layer.keyTolerance = parseFloat(document.getElementById('propKeyTolerance').value) || 0;
    layer.blend = document.getElementById('propBlend').value;
    layer._keyCache = null; // 去背參數改變，清掉快取讓下次重算

    if (layer.type === 'text') {
        layer.text = document.getElementById('propText').value;
        layer.fontFamily = document.getElementById('propFontFamily').value;
        layer.fontSize = parseFloat(document.getElementById('propFontSize').value) || 40;
        layer.bold = document.getElementById('propBold').checked;
        layer.textColor = document.getElementById('propTextColor').value;
        layer.strokeColor = document.getElementById('propStrokeColor').value;
        layer.strokeWidth = parseFloat(document.getElementById('propStrokeWidth').value) || 0;
        layer.shadow = document.getElementById('propShadow').checked;
        layer.wrapWidth = parseFloat(document.getElementById('propWrapWidth').value) || 0;
        layer.startFrame = parseInt(document.getElementById('propStartFrame').value);
        layer.endFrame = parseInt(document.getElementById('propEndFrame').value);
        updateTextLayerMetrics(layer);
        document.getElementById('propStrokeWidthVal').textContent = layer.strokeWidth;
    }

    document.getElementById('propScaleVal').textContent = Math.round(layer.scale * 100) + '%';
    document.getElementById('propRotationVal').textContent = layer.rotation + '°';
    document.getElementById('propOpacityVal').textContent = layer.opacity + '%';
    document.getElementById('propKeyToleranceVal').textContent = layer.keyTolerance;
    renderLayerList();
    renderPreview();
}

// ── 滴管：點擊畫布上的圖層取樣顏色作為去背色 ─────────
let eyedropperActive = false;
function startEyedropper() {
    const layer = layers.find(l => l.id === selectedLayerId);
    if (!layer) return;
    eyedropperActive = true;
    previewCanvas.style.cursor = 'crosshair';
}
previewCanvas.addEventListener('click', e => {
    if (!eyedropperActive) return;
    eyedropperActive = false;
    previewCanvas.style.cursor = 'grab';
    const layer = layers.find(l => l.id === selectedLayerId);
    if (!layer) return;
    const p = canvasPoint(e);
    const { lx, ly, w, h } = toLocal(layer, p.x, p.y);
    if (Math.abs(lx) > w / 2 || Math.abs(ly) > h / 2) return;
    const frame = layer.frames[layerFrameIndexAtTime(layer, currentTimeMs)];
    const sx = Math.floor((lx + w / 2) / layer.scale);
    const sy = Math.floor((ly + h / 2) / layer.scale);
    const ctx = frame.canvas.getContext('2d');
    const [r, g, b] = ctx.getImageData(Math.max(0, Math.min(layer.srcW - 1, sx)), Math.max(0, Math.min(layer.srcH - 1, sy)), 1, 1).data;
    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    document.getElementById('propKeyColor').value = hex;
    document.getElementById('propKeyEnabled').checked = true;
    updateSelectedLayer();
});

// ── 去背處理：把接近去背色的像素變透明（依 tolerance 判斷色差），結果快取在圖層上 ─────────
function getKeyedFrameCanvas(layer, frameIndex) {
    const frame = layer.frames[frameIndex];
    if (!layer.keyColor) return frame.canvas;
    if (!layer._keyCache) layer._keyCache = {};
    const cacheKey = frameIndex + '_' + layer.keyColor + '_' + layer.keyTolerance;
    if (layer._keyCache[cacheKey]) return layer._keyCache[cacheKey];

    const kr = parseInt(layer.keyColor.slice(1, 3), 16);
    const kg = parseInt(layer.keyColor.slice(3, 5), 16);
    const kb = parseInt(layer.keyColor.slice(5, 7), 16);
    const threshold = (layer.keyTolerance / 100) * 441.7; // 441.7 ≈ sqrt(255^2*3)，色差最大值

    const out = document.createElement('canvas');
    out.width = frame.canvas.width;
    out.height = frame.canvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(frame.canvas, 0, 0);
    const id = octx.getImageData(0, 0, out.width, out.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
        const dr = d[i] - kr, dg = d[i + 1] - kg, db = d[i + 2] - kb;
        if (Math.sqrt(dr * dr + dg * dg + db * db) <= threshold) d[i + 3] = 0;
    }
    octx.putImageData(id, 0, 0);
    layer._keyCache[cacheKey] = out;
    return out;
}

function moveLayer(dir) {
    const i = layers.findIndex(l => l.id === selectedLayerId);
    if (i < 0) return;
    const j = i + dir;
    if (j < 0 || j >= layers.length) return;
    [layers[i], layers[j]] = [layers[j], layers[i]];
    renderLayerList();
    renderPreview();
}

function deleteSelectedLayer() {
    const i = layers.findIndex(l => l.id === selectedLayerId);
    if (i < 0) return;
    layers.splice(i, 1);
    selectedLayerId = layers.length ? layers[layers.length - 1].id : -1;
    renderLayerList();
    selectLayer(selectedLayerId);
    renderPreview();
    if (layers.length === 0) {
        uploadArea.style.display = 'flex';
        document.getElementById('editorSection').style.display = 'none';
    }
}

function resizeCanvasSetting() {
    canvasW = parseInt(document.getElementById('canvasW').value) || canvasW;
    canvasH = parseInt(document.getElementById('canvasH').value) || canvasH;
    layers.filter(l => l.type === 'particle').forEach(initLayerParticles); // 畫布大小變了，粒子分布範圍要跟著重算
    renderPreview();
}

// ── Composite preview ──────────────────────────────
function layerGeom(layer) {
    const w = layer.srcW * layer.scale;
    const h = layer.srcH * layer.scale;
    const cx = layer.x + w / 2;
    const cy = layer.y + h / 2;
    return { w, h, cx, cy };
}

// 把畫布上的世界座標點轉成該圖層自己的（未旋轉）局部座標，方便判斷點擊是否在圖層範圍內
function toLocal(layer, px, py) {
    const { w, h, cx, cy } = layerGeom(layer);
    const dx = px - cx, dy = py - cy;
    const rad = -layer.rotation * Math.PI / 180;
    const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
    return { lx, ly, w, h, cx, cy };
}

// 把圖層局部座標（例如控制點的相對位置）轉回畫布世界座標
function toWorld(layer, lx, ly) {
    const { cx, cy } = layerGeom(layer);
    const rad = layer.rotation * Math.PI / 180;
    const wx = lx * Math.cos(rad) - ly * Math.sin(rad);
    const wy = lx * Math.sin(rad) + ly * Math.cos(rad);
    return { x: cx + wx, y: cy + wy };
}

function hitTestLayer(px, py) {
    for (let i = layers.length - 1; i >= 0; i--) {
        const layer = layers[i];
        const { lx, ly, w, h } = toLocal(layer, px, py);
        if (Math.abs(lx) <= w / 2 && Math.abs(ly) <= h / 2) return layer;
    }
    return null;
}

const HANDLE_R = 7;
function getHandles(layer) {
    const { h } = layerGeom(layer);
    return {
        scale: toWorld(layer, layerGeom(layer).w / 2, layerGeom(layer).h / 2),
        rotate: toWorld(layer, 0, -h / 2 - 24)
    };
}

function renderPreview(skipOverlay) {
    previewCanvas.width = canvasW;
    previewCanvas.height = canvasH;
    previewCtx.clearRect(0, 0, canvasW, canvasH);

    const timeline = computeMasterTimeline();
    let baseFrameIdx = 0;
    if (timeline) {
        const tm = ((currentTimeMs % timeline.totalDuration) + timeline.totalDuration) % timeline.totalDuration;
        for (let i = 0; i < timeline.starts.length; i++) if (tm >= timeline.starts[i]) baseFrameIdx = i;
    }

    for (const layer of layers) {
        if (layer.type === 'text') {
            const inRange = (layer.startFrame < 0 || baseFrameIdx >= layer.startFrame)
                          && (layer.endFrame < 0 || baseFrameIdx <= layer.endFrame);
            if (inRange) drawTextLayer(previewCtx, layer);
            continue;
        }

        if (layer.type === 'filter') {
            // 非破壞性濾鏡：把目前畫布上已疊好的內容（它下方的圖層）整張套用濾鏡效果重繪
            const snapshot = document.createElement('canvas');
            snapshot.width = canvasW; snapshot.height = canvasH;
            snapshot.getContext('2d').drawImage(previewCanvas, 0, 0);
            previewCtx.clearRect(0, 0, canvasW, canvasH);
            previewCtx.save();
            previewCtx.filter = filterCssString(layer);
            previewCtx.drawImage(snapshot, 0, 0);
            previewCtx.restore();
            continue;
        }

        if (layer.type === 'particle') {
            drawParticleLayer(previewCtx, layer, currentTimeMs);
            continue;
        }

        const frameIdx = layerFrameIndexAtTime(layer, currentTimeMs);
        const img = getKeyedFrameCanvas(layer, frameIdx);
        const { w, h, cx, cy } = layerGeom(layer);

        previewCtx.save();
        previewCtx.globalAlpha = Math.max(0, Math.min(100, layer.opacity)) / 100;
        previewCtx.globalCompositeOperation = layer.blend || 'source-over';
        previewCtx.translate(cx, cy);
        previewCtx.rotate(layer.rotation * Math.PI / 180);
        previewCtx.drawImage(img, -w / 2, -h / 2, w, h);
        previewCtx.restore();
    }

    // 選取圖層的外框與控制點（移動用整個框、右下角縮放、上方旋轉）
    const selected = skipOverlay ? null : layers.find(l => l.id === selectedLayerId);
    if (selected && selected.type !== 'filter' && selected.type !== 'particle') {
        const { w, h, cx, cy } = layerGeom(selected);
        previewCtx.save();
        previewCtx.globalAlpha = 1;
        previewCtx.globalCompositeOperation = 'source-over';
        previewCtx.translate(cx, cy);
        previewCtx.rotate(selected.rotation * Math.PI / 180);
        previewCtx.strokeStyle = '#a78bfa';
        previewCtx.lineWidth = 1.5;
        previewCtx.strokeRect(-w / 2, -h / 2, w, h);
        previewCtx.beginPath();
        previewCtx.moveTo(0, -h / 2);
        previewCtx.lineTo(0, -h / 2 - 24);
        previewCtx.stroke();
        previewCtx.restore();

        const handles = getHandles(selected);
        [handles.scale, handles.rotate].forEach(pt => {
            previewCtx.save();
            previewCtx.fillStyle = '#a78bfa';
            previewCtx.strokeStyle = '#0d0d0d';
            previewCtx.lineWidth = 1.5;
            previewCtx.beginPath();
            previewCtx.arc(pt.x, pt.y, HANDLE_R, 0, Math.PI * 2);
            previewCtx.fill();
            previewCtx.stroke();
            previewCtx.restore();
        });
    }

    const frameLabel = timeline
        ? '幀 ' + (baseFrameIdx + 1) + '/' + timeline.starts.length + '（基準：' + timeline.base.name + '）'
        : '靜態畫面';
    document.getElementById('previewInfo').textContent = layers.length + ' 個圖層 · ' + frameLabel;
}

// ── Canvas 拖曳互動：移動／縮放／旋轉 ───────────────
function canvasPoint(e) {
    const rect = previewCanvas.getBoundingClientRect();
    const scaleX = previewCanvas.width / rect.width;
    const scaleY = previewCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

let dragMode = null; // 'move' | 'scale' | 'rotate'
let dragStart = null;

// 滑鼠滾輪：對目前選取的圖層做放大縮小（往上滾放大、往下滾縮小）
previewCanvas.addEventListener('wheel', e => {
    const selected = layers.find(l => l.id === selectedLayerId);
    if (!selected || selected.type === 'filter' || selected.type === 'particle') return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
    selected.scale = Math.max(0.05, Math.min(10, selected.scale * factor));

    document.getElementById('propScale').value = selected.scale.toFixed(2);
    document.getElementById('propScaleVal').textContent = Math.round(selected.scale * 100) + '%';
    renderPreview();
}, { passive: false });

previewCanvas.addEventListener('mousedown', e => {
    const p = canvasPoint(e);
    const selected = layers.find(l => l.id === selectedLayerId);

    if (selected) {
        const handles = getHandles(selected);
        if (Math.hypot(p.x - handles.scale.x, p.y - handles.scale.y) <= HANDLE_R + 3) {
            const { cx, cy } = layerGeom(selected);
            dragMode = 'scale';
            dragStart = { cx, cy, startDist: Math.hypot(p.x - cx, p.y - cy) || 1, startScale: selected.scale, layer: selected };
            e.preventDefault();
            return;
        }
        if (Math.hypot(p.x - handles.rotate.x, p.y - handles.rotate.y) <= HANDLE_R + 3) {
            const { cx, cy } = layerGeom(selected);
            dragMode = 'rotate';
            dragStart = { cx, cy, startAngle: Math.atan2(p.y - cy, p.x - cx), startRotation: selected.rotation, layer: selected };
            e.preventDefault();
            return;
        }
    }

    const hit = hitTestLayer(p.x, p.y);
    if (hit) {
        if (hit.id !== selectedLayerId) selectLayer(hit.id);
        dragMode = 'move';
        dragStart = { px: p.x, py: p.y, layerX: hit.x, layerY: hit.y, layer: hit };
        e.preventDefault();
    }
});

window.addEventListener('mousemove', e => {
    if (!dragMode || !dragStart) return;
    const p = canvasPoint(e);
    const layer = dragStart.layer;

    if (dragMode === 'move') {
        layer.x = dragStart.layerX + (p.x - dragStart.px);
        layer.y = dragStart.layerY + (p.y - dragStart.py);
    } else if (dragMode === 'scale') {
        const dist = Math.hypot(p.x - dragStart.cx, p.y - dragStart.cy) || 1;
        layer.scale = Math.max(0.05, dragStart.startScale * (dist / dragStart.startDist));
    } else if (dragMode === 'rotate') {
        const angle = Math.atan2(p.y - dragStart.cy, p.x - dragStart.cx);
        layer.rotation = Math.round(dragStart.startRotation + (angle - dragStart.startAngle) * 180 / Math.PI);
    }

    if (layer.id === selectedLayerId) {
        document.getElementById('propX').value = Math.round(layer.x);
        document.getElementById('propY').value = Math.round(layer.y);
        document.getElementById('propScale').value = layer.scale.toFixed(2);
        document.getElementById('propScaleVal').textContent = Math.round(layer.scale * 100) + '%';
        document.getElementById('propRotation').value = ((layer.rotation % 360) + 540) % 360 - 180;
        document.getElementById('propRotationVal').textContent = layer.rotation + '°';
    }
    renderPreview();
});

window.addEventListener('mouseup', () => { dragMode = null; dragStart = null; });

// ── Play controls ──────────────────────────────────
function togglePlay() {
    if (isPlaying) { stopPlay(); return; }
    if (layers.length === 0) return;
    isPlaying = true;
    playLastTick = performance.now();
    document.getElementById('btnPlay').textContent = '⏸ 暫停';
    playTimer = setInterval(() => {
        const now = performance.now();
        currentTimeMs += now - playLastTick;
        playLastTick = now;
        const timeline = computeMasterTimeline();
        if (timeline && timeline.totalDuration > 0) currentTimeMs %= timeline.totalDuration;
        renderPreview();
    }, TICK_MS);
}
function stopPlay() {
    isPlaying = false;
    document.getElementById('btnPlay').textContent = '▶ 播放';
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
}
function stepFrame(dir) {
    stopPlay();
    const timeline = computeMasterTimeline();
    if (!timeline) { renderPreview(); return; }
    // 找出目前所在的基準幀，往前/後移動到下一個幀邊界時間
    let idx = 0;
    const tm = ((currentTimeMs % timeline.totalDuration) + timeline.totalDuration) % timeline.totalDuration;
    for (let i = 0; i < timeline.starts.length; i++) if (tm >= timeline.starts[i]) idx = i;
    idx = (idx + dir + timeline.starts.length) % timeline.starts.length;
    currentTimeMs = timeline.starts[idx];
    renderPreview();
}

// ── 輸出 GIF：把每個時間軸幀合成好的畫面收集起來，交給 gif.js 編碼 ───
function buildOutputFrames() {
    const savedTime = currentTimeMs;
    const timeline = computeMasterTimeline();
    const outFrames = [];

    if (!timeline) {
        renderPreview(true);
        const c = document.createElement('canvas');
        c.width = canvasW; c.height = canvasH;
        c.getContext('2d').drawImage(previewCanvas, 0, 0);
        outFrames.push({ canvas: c, delay: 100 });
    } else {
        for (let i = 0; i < timeline.starts.length; i++) {
            currentTimeMs = timeline.starts[i];
            renderPreview(true);
            const c = document.createElement('canvas');
            c.width = canvasW; c.height = canvasH;
            c.getContext('2d').drawImage(previewCanvas, 0, 0);
            const next = (i + 1 < timeline.starts.length) ? timeline.starts[i + 1] : timeline.totalDuration;
            outFrames.push({ canvas: c, delay: Math.max(next - timeline.starts[i], 10) });
        }
    }

    currentTimeMs = savedTime;
    renderPreview();
    return outFrames;
}

function hasAnyTransparency(outFrames) {
    for (const f of outFrames) {
        const d = f.canvas.getContext('2d').getImageData(0, 0, f.canvas.width, f.canvas.height).data;
        for (let i = 3; i < d.length; i += 4) if (d[i] < 128) return true;
    }
    return false;
}

function findSafeTransColor(outFrames) {
    const candidates = [
        0x010203, 0x0102FE, 0x01FE01, 0xFE0102,
        0xFEFE01, 0xFE01FE, 0x7F007F, 0x007F7F,
        0x7F7F00, 0xFF007F, 0x007FFF, 0x7FFF00
    ];
    const usedColors = new Set();
    for (const f of outFrames) {
        const d = f.canvas.getContext('2d').getImageData(0, 0, f.canvas.width, f.canvas.height).data;
        for (let i = 0; i < d.length; i += 4)
            if (d[i + 3] >= 128) usedColors.add((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]);
    }
    for (const c of candidates) if (!usedColors.has(c)) return c;
    const usedArr = [...usedColors];
    let best = candidates[0], bestD = -1;
    for (const c of candidates) {
        let minD = Infinity;
        for (const u of usedArr) {
            const dr = ((c >> 16) & 0xff) - ((u >> 16) & 0xff);
            const dg = ((c >> 8) & 0xff) - ((u >> 8) & 0xff);
            const db = (c & 0xff) - (u & 0xff);
            const d = dr * dr + dg * dg + db * db;
            if (d < minD) minD = d;
        }
        if (minD > bestD) { bestD = minD; best = c; }
    }
    return best;
}

function exportGIF() {
    if (layers.length === 0) return;
    const btn = document.getElementById('btnExport');
    if (btn.disabled) return;
    btn.disabled = true;
    const prog = document.getElementById('exportProgress');
    prog.textContent = '合成畫面中...';

    setTimeout(() => {
        const outFrames = buildOutputFrames();
        const quality = parseInt(document.getElementById('outQuality').value) || 10;

        const workerBlob = new Blob(
            [document.getElementById('worker-code').textContent],
            { type: 'application/javascript' }
        );
        const workerUrl = URL.createObjectURL(workerBlob);

        const useTransparency = hasAnyTransparency(outFrames);
        const transColor = useTransparency ? findSafeTransColor(outFrames) : null;
        const tR = transColor !== null ? (transColor >> 16) & 0xff : 0;
        const tG = transColor !== null ? (transColor >> 8) & 0xff : 0;
        const tB = transColor !== null ? transColor & 0xff : 0;

        const gif = new GIF({
            workers: 2, quality, width: canvasW, height: canvasH,
            workerScript: workerUrl,
            transparent: transColor
        });

        outFrames.forEach(f => {
            const tctx = f.canvas.getContext('2d');
            if (useTransparency) {
                const id = tctx.getImageData(0, 0, canvasW, canvasH);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) {
                    if (d[i + 3] < 128) { d[i] = tR; d[i + 1] = tG; d[i + 2] = tB; d[i + 3] = 255; }
                }
                tctx.putImageData(id, 0, 0);
            }
            gif.addFrame(tctx, { delay: f.delay, copy: true });
        });

        gif.on('progress', p => { prog.textContent = '匯出中... ' + Math.round(p * 100) + '%'; });
        gif.on('finished', blob => {
            URL.revokeObjectURL(workerUrl);
            btn.disabled = false;
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'combined.gif';
            link.click();
            prog.textContent = '✅ 匯出完成！';
        });
        gif.on('error', err => {
            URL.revokeObjectURL(workerUrl);
            btn.disabled = false;
            prog.textContent = '❌ 匯出失敗：' + (err || '未知錯誤');
        });

        gif.render();
    }, 10);
}
</script>
</body>
