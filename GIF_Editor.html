<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Editor - GIF 幀編輯器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
a{color:#a78bfa;text-decoration:none}
header{padding:16px 24px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;gap:16px}
header h1{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.back-link{font-size:0.8rem;color:#666;margin-left:auto}
.back-link:hover{color:#a78bfa}

/* Upload */
#uploadArea{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 24px;cursor:pointer;border:2px dashed #333;margin:32px auto;max-width:480px;border-radius:16px;transition:border-color .2s}
#uploadArea:hover,#uploadArea.dragover{border-color:#a78bfa}
#uploadArea h2{font-size:1.1rem;color:#ccc}
#uploadArea p{font-size:0.85rem;color:#666}
.btn-upload{background:#1e1628;border:1px solid #a78bfa;color:#a78bfa;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:background .2s}
.btn-upload:hover{background:#2a1f38}
#fileInput{display:none}

/* Editor */
#editorSection{display:none;flex-direction:column;flex:1}

/* Frame strip */
.strip-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#111;border-bottom:1px solid #222}
.strip-toolbar span{font-size:0.8rem;color:#888;margin-right:4px}
#frameStrip{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#0f0f0f;border-bottom:1px solid #1a1a1a;min-height:130px;align-items:flex-start}
#frameStrip::-webkit-scrollbar{height:4px}
#frameStrip::-webkit-scrollbar-track{background:#0f0f0f}
#frameStrip::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.frame-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px;border-radius:6px;border:2px solid transparent;transition:border-color .15s;flex-shrink:0;user-select:none}
.frame-item:hover{border-color:#444}
.frame-item.selected{border-color:#a78bfa}
.frame-item canvas{border-radius:3px;display:block}
.frame-label{font-size:0.7rem;color:#888;white-space:nowrap}
.frame-item.drag-over{border-color:#60a5fa;background:#0a0a1a}

/* Main editor */
.editor-main{display:flex;flex:1;overflow:hidden}
.preview-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;gap:12px;min-height:300px}
.preview-wrap{position:relative;display:inline-flex}
.preview-wrap::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,#2a2a2a 25%,transparent 25%),linear-gradient(-45deg,#2a2a2a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2a2a 75%),linear-gradient(-45deg,transparent 75%,#2a2a2a 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;border-radius:4px;z-index:0}
#previewCanvas{position:relative;z-index:1;max-width:100%;max-height:calc(100vh - 360px);border-radius:4px;image-rendering:pixelated}
.preview-info{font-size:0.78rem;color:#555}
.play-bar{display:flex;gap:8px;align-items:center}

/* Controls */
.controls-section{width:320px;background:#111;border-left:1px solid #1e1e1e;overflow-y:auto;display:flex;flex-direction:column}
.controls-section::-webkit-scrollbar{width:4px}
.controls-section::-webkit-scrollbar-thumb{background:#333}
.ctrl-group{padding:16px;border-bottom:1px solid #1a1a1a}
.ctrl-group h3{font-size:0.78rem;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ctrl-row label{font-size:0.8rem;color:#aaa;min-width:52px;flex-shrink:0}
.ctrl-row input[type=number],.ctrl-row input[type=text]{background:#1a1a1a;border:1px solid #2a2a2a;color:#e0e0e0;padding:5px 8px;border-radius:6px;font-size:0.82rem;width:80px}
.ctrl-row input[type=number]:focus,.ctrl-row input[type=text]:focus{outline:none;border-color:#a78bfa}
.ctrl-row input[type=range]{flex:1;accent-color:#a78bfa}
.ctrl-row input[type=color]{background:none;border:none;width:32px;height:28px;padding:0;cursor:pointer;border-radius:4px}
.ctrl-row .val-label{font-size:0.78rem;color:#666;min-width:36px;text-align:right}
.ctrl-row input[type=text].full{width:100%;flex:1}
.btn-row{display:flex;gap:6px;margin-top:4px}
.btn{background:#1e1e1e;border:1px solid #2a2a2a;color:#ccc;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:background .15s}
.btn:hover{background:#2a2a2a;color:#fff}
.btn.primary{background:#2a1f38;border-color:#a78bfa;color:#a78bfa}
.btn.primary:hover{background:#3a2f50}
.btn.danger{background:#1e1010;border-color:#ef4444;color:#ef4444}
.btn.danger:hover{background:#2a1010}
.btn.success{background:#0f2420;border-color:#34d399;color:#34d399;padding:10px 20px;font-size:0.9rem;width:100%}
.btn.success:hover{background:#0f3028}
.btn.small{padding:4px 8px;font-size:0.75rem}
.progress{font-size:0.8rem;color:#60a5fa;margin-top:8px;min-height:18px}
.frame-count{font-size:0.8rem;color:#666}

/* Frame Manager Modal */
#fmOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center}
#fmOverlay.open{display:flex}
#fmModal{background:#111;border:1px solid #2a2a2a;border-radius:14px;width:min(92vw,860px);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
#fmHeader{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid #1e1e1e;flex-shrink:0;flex-wrap:wrap}
#fmHeader h2{font-size:1rem;font-weight:700;color:#fff;margin-right:auto}
#fmSelInfo{font-size:0.78rem;color:#60a5fa;min-width:60px}
#fmGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;padding:16px;overflow-y:auto;flex:1}
#fmGrid::-webkit-scrollbar{width:4px}
#fmGrid::-webkit-scrollbar-thumb{background:#333}
.fm-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;position:relative}
.fm-item:hover{background:#1a1a1a}
.fm-item.fm-selected{border-color:#60a5fa;background:#0a1020}
.fm-item canvas{border-radius:4px;display:block}
.fm-item .fm-lbl{font-size:0.68rem;color:#888;white-space:nowrap}
.fm-item .fm-check{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;border:2px solid #444;background:#111;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .1s}
.fm-item.fm-selected .fm-check{border-color:#60a5fa;background:#60a5fa;color:#000}
.fm-item.fm-dragging{opacity:0.35}
.fm-item.fm-drop-target{border-left:3px solid #60a5fa;border-radius:4px}
#fmFooter{padding:12px 18px;border-top:1px solid #1e1e1e;display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0}
#fmDelayRow{display:flex;align-items:center;gap:6px;margin-left:auto}
#fmDelayRow label{font-size:0.78rem;color:#aaa}
#fmDelayRow input{background:#1a1a1a;border:1px solid #2a2a2a;color:#e0e0e0;padding:4px 8px;border-radius:6px;font-size:0.8rem;width:70px}
.shift-select{background:#1e1e1e;border:1px solid #2a2a2a;color:#ccc;padding:4px 6px;border-radius:6px;font-size:0.8rem;cursor:pointer}
.shift-num{background:#1e1e1e;border:1px solid #2a2a2a;color:#e0e0e0;padding:4px 6px;border-radius:6px;font-size:0.8rem;width:58px}

@media(max-width:700px){.editor-main{flex-direction:column}.controls-section{width:100%;border-left:none;border-top:1px solid #1e1e1e}}
</style>
</head>
<body>

<header>
  <h1>🎞 GIF Editor</h1>
  <span style="font-size:0.78rem;color:#555">GIF 幀編輯器</span>
  <a class="back-link" href="index.html">← 返回首頁</a>
</header>

<!-- Upload -->
<div id="uploadArea">
  <h2>📂 上傳 GIF 檔案，或選擇多張圖片拼成 GIF</h2>
  <p>拖曳 GIF 或多張圖片到此處，或點擊選擇檔案</p>
  <label class="btn-upload" for="fileInput">選擇 GIF / 圖片</label>
  <input type="file" id="fileInput" accept="image/gif,image/png,image/jpeg,image/webp" multiple>
</div>

<!-- Editor -->
<div id="editorSection">
  <!-- Frame strip toolbar -->
  <div class="strip-toolbar">
    <span>幀列表</span>
    <span id="frameCount" class="frame-count"></span>
    <button class="btn small" id="btnUndo" onclick="undo()" disabled>↩ 復原</button>
    <button class="btn small" onclick="moveFrame(-1)">← 前移</button>
    <button class="btn small" onclick="moveFrame(1)">後移 →</button>
    <button class="btn small" onclick="duplicateFrame()">複製幀</button>
    <button class="btn small danger" onclick="deleteFrame()">刪除幀</button>
    <button class="btn small" onclick="reverseFrames()">⇄ 反轉順序</button>
    <button class="btn small danger" onclick="halveFrames()">✂ 減半幀數</button>
    <button class="btn small" onclick="fmInsertGIF()">↑ 串接 GIF</button>
    <button class="btn small primary" onclick="openFrameManager()" style="margin-left:8px">🗂 幀管理器</button>
  </div>

  <!-- Frame strip -->
  <div id="frameStrip"></div>

  <!-- Frame Manager Modal -->
  <div id="fmOverlay" onclick="fmOverlayClick(event)">
    <div id="fmModal">
      <div id="fmHeader">
        <h2>🗂 幀管理器</h2>
        <span id="fmSelInfo"></span>
        <button class="btn small" onclick="fmSelectAll()">全選</button>
        <button class="btn small" onclick="fmInvert()">反選</button>
        <button class="btn small" onclick="fmSelectNone()">清除</button>
        <button class="btn small" onclick="fmMoveSelected(-1)">← 前移</button>
        <button class="btn small" onclick="fmMoveSelected(1)">後移 →</button>
        <button class="btn small danger" onclick="fmDeleteSelected()">刪除選取</button>
        <button class="btn small" onclick="fmDuplicateSelected()">複製選取</button>
        <button class="btn small primary" onclick="fmDownloadSelected()">↓ 下載選取</button>
        <button class="btn small" onclick="fmInsertImages()">↑ 插入圖片</button>
        <button class="btn small" onclick="fmInsertGIF()">↑ 串接 GIF</button>
        <button class="btn small" id="fmBtnUndo" onclick="undo()" disabled>↩ 復原</button>
        <button class="btn small" style="background:#111;border-color:#555;color:#aaa" onclick="closeFrameManager()">✕ 關閉</button>
      </div>
      <div id="fmGrid"></div>
      <div id="fmFooter">
        <div id="fmDelayRow">
          <select class="shift-select" id="fmShiftSign"><option value="1">+</option><option value="-1">−</option></select>
          <input class="shift-num" id="fmShiftAmt" type="number" value="10" min="1" max="5000">
          <span style="font-size:0.78rem;color:#888">ms</span>
          <button class="btn small" onclick="fmShiftDelay()">調整</button>
          <label>選取幀時間 (ms)</label>
          <input type="number" id="fmDelay" value="100" min="1" max="5000" step="10">
          <button class="btn small" onclick="fmApplyDelay()">套用</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main area -->
  <div class="editor-main">
    <!-- Preview -->
    <div class="preview-section">
      <div class="preview-wrap"><canvas id="previewCanvas" onclick="handlePreviewClick(event)"></canvas></div>
      <div class="play-bar">
        <button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
        <button class="btn small" onclick="stepFrame(-1)">◀</button>
        <button class="btn small" onclick="stepFrame(1)">▶</button>
        <button class="btn small" onclick="downloadFrame(selectedIndex)" title="下載此幀 PNG">↓ 下載幀</button>
        <button class="btn small" onclick="replaceFrame(selectedIndex)" title="上傳圖片取代此幀">↑ 取代幀</button>
      </div>
      <div class="preview-info" id="previewInfo"></div>
    </div>

    <!-- Controls -->
    <div class="controls-section">

      <!-- 幀時間 -->
      <div class="ctrl-group">
        <h3>幀延遲</h3>
        <div class="ctrl-row">
          <label>延遲 (ms)</label>
          <input type="number" id="frameDelay" value="100" min="1" max="5000" step="10" style="width:80px">
        </div>
        <div class="btn-row">
          <button class="btn" onclick="applyDelay(false)">套用本幀</button>
          <button class="btn" onclick="applyDelay(true)">套用全部</button>
        </div>
        <div class="btn-row" style="align-items:center">
          <select class="shift-select" id="allShiftSign"><option value="1">+</option><option value="-1">−</option></select>
          <input class="shift-num" id="allShiftAmt" type="number" value="10" min="1" max="5000">
          <span style="font-size:0.78rem;color:#888">ms</span>
          <button class="btn small" onclick="shiftAllDelay()">調整全部</button>
        </div>
      </div>

      <!-- 裁切/縮放 -->
      <div class="ctrl-group">
        <h3>輸出尺寸</h3>
        <div class="ctrl-row">
          <label>寬</label>
          <input type="number" id="outWidth" min="1" max="2000" style="width:80px">
          <label style="min-width:24px">高</label>
          <input type="number" id="outHeight" min="1" max="2000" style="width:80px">
        </div>
        <div class="btn-row">
          <button class="btn small" onclick="resetOutputSize()">重設</button>
        </div>
      </div>

      <!-- 去背 -->
      <div class="ctrl-group">
        <h3>去背（去除顏色）</h3>
        <div class="ctrl-row">
          <span id="chromaSwatch" style="width:28px;height:28px;border-radius:6px;border:1px solid #444;background:repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 0/10px 10px;flex-shrink:0"></span>
          <button class="btn small" id="chromaPickBtn" onclick="startColorPick()">🎯 從畫面吸取顏色</button>
        </div>
        <div class="ctrl-row">
          <label>容許度</label>
          <input type="range" id="chromaTolerance" min="0" max="100" value="30" oninput="updateLabel('chromaTolerance','chromaToleranceVal')">
          <span class="val-label" id="chromaToleranceVal">30</span>
        </div>
        <div class="btn-row">
          <button class="btn" id="chromaApplyOneBtn" onclick="applyChromaKey(false)">套用本幀</button>
          <button class="btn" id="chromaApplyAllBtn" onclick="applyChromaKey(true)">套用全部</button>
        </div>
        <p style="font-size:0.72rem;color:#555;margin-top:6px" id="chromaStatus">先按吸色按鈕，再點畫面上要去除的顏色</p>
      </div>

      <!-- 匯出 -->
      <div class="ctrl-group">
        <h3>匯出</h3>
        <div class="ctrl-row">
          <label>品質</label>
          <input type="range" id="outQuality" min="1" max="20" value="10" oninput="updateLabel('outQuality','outQualityVal')">
          <span class="val-label" id="outQualityVal">10</span>
        </div>
        <p style="font-size:0.72rem;color:#555;margin-bottom:10px">品質數值越低越好，建議 1–10</p>
        <button class="btn success" onclick="exportGIF()">🔴 匯出 GIF</button>
        <div class="progress" id="exportProgress"></div>
      </div>

    </div>
  </div>
</div>

<script>
// (c) Dean McNamee <dean@gmail.com>, 2013.
//
// https://github.com/deanm/omggif
//

// of this software and associated documentation files (the "Software"), to

// IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
// FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
// AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
// LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING
// FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS
// IN THE SOFTWARE.
//
// omggif is a JavaScript implementation of a GIF 89a encoder and decoder,
// including animation and compression.  It does not rely on any specific
// underlying system, so should run in the browser, Node, or Plask.

"use strict";

function GifWriter(buf, width, height, gopts) {
  var p = 0;

  var gopts = gopts === undefined ? { } : gopts;
  var loop_count = gopts.loop === undefined ? null : gopts.loop;
  var global_palette = gopts.palette === undefined ? null : gopts.palette;

  if (width <= 0 || height <= 0 || width > 65535 || height > 65535)
    throw new Error("Width/Height invalid.");

  function check_palette_and_num_colors(palette) {
    var num_colors = palette.length;
    if (num_colors < 2 || num_colors > 256 ||  num_colors & (num_colors-1)) {
      throw new Error(
          "Invalid code/color length, must be power of 2 and 2 .. 256.");
    }
    return num_colors;
  }

  // - Header.
  buf[p++] = 0x47; buf[p++] = 0x49; buf[p++] = 0x46;  // GIF
  buf[p++] = 0x38; buf[p++] = 0x39; buf[p++] = 0x61;  // 89a

  // Handling of Global Color Table (palette) and background index.
  var gp_num_colors_pow2 = 0;
  var background = 0;
  if (global_palette !== null) {
    var gp_num_colors = check_palette_and_num_colors(global_palette);
    while (gp_num_colors >>= 1) ++gp_num_colors_pow2;
    gp_num_colors = 1 << gp_num_colors_pow2;
    --gp_num_colors_pow2;
    if (gopts.background !== undefined) {
      background = gopts.background;
      if (background >= gp_num_colors)
        throw new Error("Background index out of range.");
      // The GIF spec states that a background index of 0 should be ignored, so
      // this is probably a mistake and you really want to set it to another
      // slot in the palette.  But actually in the end most browsers, etc end
      // up ignoring this almost completely (including for dispose background).
      if (background === 0)
        throw new Error("Background index explicitly passed as 0.");
    }
  }

  // - Logical Screen Descriptor.
  // NOTE(deanm): w/h apparently ignored by implementations, but set anyway.
  buf[p++] = width & 0xff; buf[p++] = width >> 8 & 0xff;
  buf[p++] = height & 0xff; buf[p++] = height >> 8 & 0xff;
  // NOTE: Indicates 0-bpp original color resolution (unused?).
  buf[p++] = (global_palette !== null ? 0x80 : 0) |  // Global Color Table Flag.
             gp_num_colors_pow2;  // NOTE: No sort flag (unused?).
  buf[p++] = background;  // Background Color Index.
  buf[p++] = 0;  // Pixel aspect ratio (unused?).

  // - Global Color Table
  if (global_palette !== null) {
    for (var i = 0, il = global_palette.length; i < il; ++i) {
      var rgb = global_palette[i];
      buf[p++] = rgb >> 16 & 0xff;
      buf[p++] = rgb >> 8 & 0xff;
      buf[p++] = rgb & 0xff;
    }
  }

  if (loop_count !== null) {  // Netscape block for looping.
    if (loop_count < 0 || loop_count > 65535)
      throw new Error("Loop count invalid.")
    // Extension code, label, and length.
    buf[p++] = 0x21; buf[p++] = 0xff; buf[p++] = 0x0b;
    // NETSCAPE2.0
    buf[p++] = 0x4e; buf[p++] = 0x45; buf[p++] = 0x54; buf[p++] = 0x53;
    buf[p++] = 0x43; buf[p++] = 0x41; buf[p++] = 0x50; buf[p++] = 0x45;
    buf[p++] = 0x32; buf[p++] = 0x2e; buf[p++] = 0x30;
    // Sub-block
    buf[p++] = 0x03; buf[p++] = 0x01;
    buf[p++] = loop_count & 0xff; buf[p++] = loop_count >> 8 & 0xff;
    buf[p++] = 0x00;  // Terminator.
  }


  var ended = false;

  this.addFrame = function(x, y, w, h, indexed_pixels, opts) {
    if (ended === true) { --p; ended = false; }  // Un-end.

    opts = opts === undefined ? { } : opts;

    // TODO(deanm): Bounds check x, y.  Do they need to be within the virtual
    // canvas width/height, I imagine?
    if (x < 0 || y < 0 || x > 65535 || y > 65535)
      throw new Error("x/y invalid.")

    if (w <= 0 || h <= 0 || w > 65535 || h > 65535)
      throw new Error("Width/Height invalid.")

    if (indexed_pixels.length < w * h)
      throw new Error("Not enough pixels for the frame size.");

    var using_local_palette = true;
    var palette = opts.palette;
    if (palette === undefined || palette === null) {
      using_local_palette = false;
      palette = global_palette;
    }

    if (palette === undefined || palette === null)
      throw new Error("Must supply either a local or global palette.");

    var num_colors = check_palette_and_num_colors(palette);

    // Compute the min_code_size (power of 2), destroying num_colors.
    var min_code_size = 0;
    while (num_colors >>= 1) ++min_code_size;
    num_colors = 1 << min_code_size;  // Now we can easily get it back.

    var delay = opts.delay === undefined ? 0 : opts.delay;

    // From the spec:
    //     0 -   No disposal specified. The decoder is
    //           not required to take any action.
    //     1 -   Do not dispose. The graphic is to be left
    //           in place.
    //     2 -   Restore to background color. The area used by the
    //           graphic must be restored to the background color.
    //     3 -   Restore to previous. The decoder is required to
    //           restore the area overwritten by the graphic with
    //           what was there prior to rendering the graphic.
    //  4-7 -    To be defined.
    // NOTE(deanm): Dispose background doesn't really work, apparently most
    // browsers ignore the background palette index and clear to transparency.
    var disposal = opts.disposal === undefined ? 0 : opts.disposal;
    if (disposal < 0 || disposal > 3)  // 4-7 is reserved.
      throw new Error("Disposal out of range.");

<script>
// ── State ──────────────────────────────────────────
let frames = [];
let selectedIndex = -1;
let gifWidth = 0, gifHeight = 0;
let isPlaying = false, playTimer = null;
let dragSrcIndex = -1;

// ── Upload ─────────────────────────────────────────
const uploadArea = document.getElementById('uploadArea');
const fileInput  = document.getElementById('fileInput');

uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    handleUploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => { handleUploadFiles(e.target.files); e.target.value = ''; });

function handleUploadFiles(fileList) {
    const files = Array.from(fileList).filter(f =>
        ['image/gif', 'image/png', 'image/jpeg', 'image/webp'].includes(f.type));
    if (!files.length) return;

    if (files.length === 1 && files[0].type === 'image/gif') {
        loadGIF(files[0]);
        return;
    }

    const images = files.filter(f => f.type !== 'image/gif');
    if (images.length) loadImagesAsFrames(images);
    else alert('多張檔案上傳時請選擇圖片（PNG/JPEG/WEBP），不支援多個 GIF 一起上傳。');
}

// ── Load static images as frames ────────────────────
async function loadImagesAsFrames(files) {
    stopPlay();
    const sorted = [...files].sort((a, b) =>
        a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    try {
        const newFrames = await Promise.all(sorted.map(file => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = img.width; c.height = img.height;
                c.getContext('2d').drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                resolve({ canvas: c, delay: 500 });
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
            img.src = url;
        })));

        frames = newFrames;
        gifWidth  = Math.max(...frames.map(f => f.canvas.width));
        gifHeight = Math.max(...frames.map(f => f.canvas.height));

        document.getElementById('outWidth').value  = gifWidth;
        document.getElementById('outHeight').value = gifHeight;
        selectedIndex = 0;
        cmdHistory.length = 0;
        updateUndoBtns();
        uploadArea.style.display = 'none';
        document.getElementById('editorSection').style.display = 'flex';
        renderFrameStrip();
        renderPreview();
    } catch (err) {
        alert('圖片載入失敗：' + err.message);
    }
}

document.getElementById('frameStrip').addEventListener('wheel', e => {
    if (e.deltaY === 0) return;
    e.preventDefault();
    e.currentTarget.scrollLeft += e.deltaY;
}, { passive: false });
uploadArea.addEventListener('click', e => { if (e.target !== document.querySelector('.btn-upload')) fileInput.click(); });

// ── Load GIF ───────────────────────────────────────
async function loadGIF(file) {
    stopPlay();
    try {
        const buf = await file.arrayBuffer();
        const gr = new GifReader(new Uint8Array(buf));
        gifWidth  = gr.width;
        gifHeight = gr.height;

        frames = [];
        const W = gifWidth, H = gifHeight;
        const compositePixels = new Uint8ClampedArray(W * H * 4);
        const savedPixels     = new Uint8ClampedArray(W * H * 4);
        const n = gr.numFrames();

        for (let i = 0; i < n; i++) {
            const info = gr.frameInfo(i);

            if (i > 0) {
                const prev = gr.frameInfo(i - 1);
                if (prev.disposal === 2) {
                    for (let py = prev.y; py < prev.y + prev.height; py++) {
                        const s = (py * W + prev.x) * 4;
                        compositePixels.fill(0, s, s + prev.width * 4);
                    }
                } else if (prev.disposal === 3) {
                    compositePixels.set(savedPixels);
                }
            }
            if (info.disposal === 3) savedPixels.set(compositePixels);

            gr.decodeAndBlitFrameRGBA(i, compositePixels);

            const c = document.createElement('canvas');
            c.width = W; c.height = H;
            c.getContext('2d').putImageData(
                new ImageData(new Uint8ClampedArray(compositePixels), W, H), 0, 0
            );
            frames.push({ canvas: c, delay: Math.max((info.delay || 10) * 10, 1) });
        }

        document.getElementById('outWidth').value  = gifWidth;
        document.getElementById('outHeight').value = gifHeight;
        selectedIndex = 0;
        cmdHistory.length = 0;
        updateUndoBtns();
        uploadArea.style.display = 'none';
        document.getElementById('editorSection').style.display = 'flex';
        renderFrameStrip();
        renderPreview();
    } catch (err) {
        alert('無法載入 GIF：' + (err.message || err));
    }
}

// ── Frame strip ────────────────────────────────────
function renderFrameStrip() {
    const strip = document.getElementById('frameStrip');
    strip.innerHTML = '';
    const THUMB_W = 80;
    frames.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'frame-item' + (i === selectedIndex ? ' selected' : '');
        div.draggable = true;
        div.dataset.index = i;

        const th = document.createElement('canvas');
        const ratio = f.canvas.height / f.canvas.width;
        th.width  = THUMB_W;
        th.height = Math.round(THUMB_W * ratio);
        th.getContext('2d').drawImage(f.canvas, 0, 0, th.width, th.height);

        const lbl = document.createElement('div');
        lbl.className = 'frame-label';
        lbl.textContent = '#' + (i + 1) + ' · ' + f.delay + 'ms';

        div.appendChild(th);
        div.appendChild(lbl);

        div.addEventListener('click', () => selectFrame(i));
        div.addEventListener('dragstart', e => { dragSrcIndex = i; e.dataTransfer.effectAllowed = 'move'; });
        div.addEventListener('dragenter', e => { e.preventDefault(); div.classList.add('drag-over'); });
        div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
        div.addEventListener('dragover', e => e.preventDefault());
        div.addEventListener('drop', e => {
            e.preventDefault();
            div.classList.remove('drag-over');
            if (dragSrcIndex !== i) {
                const from = dragSrcIndex, to = i;
                const exec = () => {
                    const [f] = frames.splice(from, 1);
                    frames.splice(to, 0, f);
                    selectedIndex = to;
                    renderFrameStrip(); renderPreview();
                };
                pushCmd({ exec, undo() {
                    const [f] = frames.splice(to, 1);
                    frames.splice(from, 0, f);
                    selectedIndex = from;
                    renderFrameStrip(); renderPreview();
                }});
                exec();
            }
        });

        strip.appendChild(div);
    });
    document.getElementById('frameCount').textContent = frames.length + ' 幀';

    // Scroll selected into view
    const sel = strip.querySelector('.selected');
    if (sel) sel.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// ── Frame Download / Replace ────────────────────────
function downloadFrame(i) {
    const a = document.createElement('a');
    a.href = frames[i].canvas.toDataURL('image/png');
    a.download = 'frame_' + String(i + 1).padStart(3, '0') + '.png';
    a.click();
}

function replaceFrame(i) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/png,image/jpeg,image/webp';
    input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const nc = document.createElement('canvas');
            nc.width = img.width; nc.height = img.height;
            nc.getContext('2d').drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            const old = frames[i].canvas;
            const exec = () => { frames[i].canvas = nc; renderFrameStrip(); if (selectedIndex === i) renderPreview(); };
            pushCmd({ exec, undo() { frames[i].canvas = old; renderFrameStrip(); if (selectedIndex === i) renderPreview(); } });
            exec();
        };
        img.src = url;
    };
    input.click();
}

// ── Select / Preview ───────────────────────────────
function selectFrame(i) {
    if (i < 0 || i >= frames.length) return;
    selectedIndex = i;
    renderFrameStrip();
    renderPreview();
}

function renderPreview() {
    if (!frames.length || selectedIndex < 0) return;
    const f = frames[selectedIndex];
    const c = document.getElementById('previewCanvas');
    c.width  = f.canvas.width;
    c.height = f.canvas.height;
    c.getContext('2d').drawImage(f.canvas, 0, 0);
    document.getElementById('frameDelay').value = f.delay;
    document.getElementById('previewInfo').textContent =
        '幀 ' + (selectedIndex + 1) + ' / ' + frames.length +
        '　' + f.canvas.width + '×' + f.canvas.height + '　延遲 ' + f.delay + 'ms';
}

// ── Play ───────────────────────────────────────────
function togglePlay() {
    isPlaying ? stopPlay() : startPlay();
}
function startPlay() {
    isPlaying = true;
    document.getElementById('btnPlay').textContent = '⏸ 暫停';
    playNext();
}
function stopPlay() {
    clearTimeout(playTimer);
    isPlaying = false;
    document.getElementById('btnPlay').textContent = '▶ 播放';
}
function playNext() {
    if (!isPlaying) return;
    selectedIndex = (selectedIndex + 1) % frames.length;
    renderPreview();
    // Update frame strip selection without full re-render for performance
    document.querySelectorAll('.frame-item').forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIndex);
    });
    const selEl = document.querySelector('.frame-item.selected');
    if (selEl) selEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    playTimer = setTimeout(playNext, frames[selectedIndex].delay);
}
function stepFrame(dir) {
    stopPlay();
    selectFrame((selectedIndex + dir + frames.length) % frames.length);
}

// ── Frame operations ───────────────────────────────
// ── Undo / Redo ────────────────────────────────────
const MAX_HISTORY = 10;
const cmdHistory = [];

function pushCmd(cmd) {
    cmdHistory.push(cmd);
    if (cmdHistory.length > MAX_HISTORY) cmdHistory.shift();
    updateUndoBtns();
}
function undo() {
    if (!cmdHistory.length) return;
    cmdHistory.pop().undo();
    updateUndoBtns();
}
function updateUndoBtns() {
    const canUndo = cmdHistory.length > 0;
    document.getElementById('btnUndo').disabled = !canUndo;
    const fu = document.getElementById('fmBtnUndo');
    if (fu) fu.disabled = !canUndo;
}

function cloneFrame(f) {
    const nc = document.createElement('canvas');
    nc.width = f.canvas.width; nc.height = f.canvas.height;
    nc.getContext('2d').drawImage(f.canvas, 0, 0);
    return { canvas: nc, delay: f.delay };
}

document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        const tag = e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        e.preventDefault(); undo();
    }
});

function deleteFrame() {
    if (frames.length <= 1) { alert('至少保留一幀'); return; }
    const idx = selectedIndex;
    const saved = frames[idx];
    const exec = () => {
        frames.splice(idx, 1);
        selectedIndex = Math.min(idx, frames.length - 1);
        renderFrameStrip(); renderPreview();
    };
    pushCmd({ exec, undo() { frames.splice(idx, 0, saved); selectedIndex = idx; renderFrameStrip(); renderPreview(); } });
    exec();
}

function duplicateFrame() {
    const idx = selectedIndex;
    const newFrame = cloneFrame(frames[idx]);
    const exec = () => {
        frames.splice(idx + 1, 0, newFrame);
        selectedIndex = idx + 1;
        renderFrameStrip(); renderPreview();
    };
    pushCmd({ exec, undo() { frames.splice(idx + 1, 1); selectedIndex = idx; renderFrameStrip(); renderPreview(); } });
    exec();
}

function moveFrame(dir) {
    const from = selectedIndex;
    const to = from + dir;
    if (to < 0 || to >= frames.length) return;
    const exec = () => {
        const [f] = frames.splice(from, 1);
        frames.splice(to, 0, f);
        selectedIndex = to;
        renderFrameStrip(); renderPreview();
    };
    pushCmd({ exec, undo() {
        const [f] = frames.splice(to, 1);
        frames.splice(from, 0, f);
        selectedIndex = from;
        renderFrameStrip(); renderPreview();
    }});
    exec();
}

function reverseFrames() {
    const exec = () => { frames.reverse(); selectedIndex = 0; renderFrameStrip(); renderPreview(); };
    pushCmd({ exec, undo: exec });
    exec();
}

// ── 減半幀數（刪除偶數編號幀） ─────────────────────────
function halveFrames() {
    if (frames.length < 2) { alert('目前幀數太少，無法執行減半。'); return; }

    const removeCount = Math.floor(frames.length / 2);
    const keepCount = frames.length - removeCount;
    const ok = confirm(
        '這個功能會刪除偶數編號的幀（例如共 1~10 幀時，會刪除第 2、4、6、8、10 幀，只保留第 1、3、5、7、9 幀），藉此把幀數減半。\n\n' +
        '目前共 ' + frames.length + ' 幀，執行後會刪除 ' + removeCount + ' 幀，保留 ' + keepCount + ' 幀。\n' +
        '注意：因為幀數變少但每幀延遲不變，動畫播放速度會變快。\n\n' +
        '確定要執行嗎？此動作可以按「復原」還原。'
    );
    if (!ok) return;

    const oldFrames = frames.slice();
    const oldSelected = selectedIndex;
    // 0-based 偶數索引 = 1-based 奇數編號（1,3,5...），保留下來
    const newFrames = frames.filter((_, i) => i % 2 === 0);

    const exec = () => {
        frames = newFrames;
        selectedIndex = Math.min(oldSelected, frames.length - 1);
        renderFrameStrip(); renderPreview();
    };
    const undo = () => {
        frames = oldFrames;
        selectedIndex = oldSelected;
        renderFrameStrip(); renderPreview();
    };
    pushCmd({ exec, undo });
    exec();
}

// ── Delay ──────────────────────────────────────────
function applyDelay(toAll) {
    const ms = Math.max(1, parseInt(document.getElementById('frameDelay').value) || 100);
    const targets = toAll ? frames.map((_, i) => i) : [selectedIndex];
    const oldDelays = targets.map(i => frames[i].delay);
    const exec = () => { targets.forEach(i => frames[i].delay = ms); renderFrameStrip(); renderPreview(); };
    pushCmd({ exec, undo() { targets.forEach((i, j) => frames[i].delay = oldDelays[j]); renderFrameStrip(); renderPreview(); } });
    exec();
}

function shiftAllDelay() {
    const delta = parseInt(document.getElementById('allShiftSign').value) * (Math.max(1, parseInt(document.getElementById('allShiftAmt').value) || 10));
    const oldDelays = frames.map(f => f.delay);
    const exec = () => {
        frames.forEach(f => f.delay = Math.max(1, f.delay + delta));
        renderFrameStrip(); renderPreview();
    };
    pushCmd({ exec, undo() { frames.forEach((f, i) => f.delay = oldDelays[i]); renderFrameStrip(); renderPreview(); } });
    exec();
}

// ── 去背（吸色去除） ─────────────────────────────────
let pickedChromaColor = null;
let isPickingChroma = false;

function startColorPick() {
    if (!frames.length) return;
    isPickingChroma = true;
    document.getElementById('previewCanvas').style.cursor = 'crosshair';
    document.getElementById('chromaPickBtn').textContent = '👉 請點擊畫面上的顏色...';
}

function handlePreviewClick(e) {
    if (!isPickingChroma) return;
    const c = document.getElementById('previewCanvas');
    const rect = c.getBoundingClientRect();
    const x = Math.min(c.width - 1, Math.max(0, Math.floor((e.clientX - rect.left) * (c.width / rect.width))));
    const y = Math.min(c.height - 1, Math.max(0, Math.floor((e.clientY - rect.top) * (c.height / rect.height))));
    const px = c.getContext('2d').getImageData(x, y, 1, 1).data;
    pickedChromaColor = { r: px[0], g: px[1], b: px[2] };

    isPickingChroma = false;
    c.style.cursor = '';
    document.getElementById('chromaPickBtn').textContent = '🎯 從畫面吸取顏色';
    document.getElementById('chromaSwatch').style.background = `rgb(${px[0]},${px[1]},${px[2]})`;
}

function applyChromaKey(toAll) {
    if (!pickedChromaColor) { alert('請先按「吸取顏色」再點選畫面上要去除的顏色'); return; }
    if (!frames.length || selectedIndex < 0) return;

    const btn1 = document.getElementById('chromaApplyOneBtn');
    const btn2 = document.getElementById('chromaApplyAllBtn');
    const status = document.getElementById('chromaStatus');
    btn1.disabled = true;
    btn2.disabled = true;
    status.textContent = toAll ? '⏳ 處理中...（套用全部幀，請稍候）' : '⏳ 處理中...';

    // 用 setTimeout 讓畫面先把「處理中」文字畫出來，再開始跑耗時的像素運算
    setTimeout(() => {
        const tol = parseInt(document.getElementById('chromaTolerance').value) || 0;
        const threshold = (tol / 100) * 441.7; // 最大可能的 RGB 距離 ≈ 441.7
        const targets = toAll ? frames.map((_, i) => i) : [selectedIndex];
        const { r, g, b } = pickedChromaColor;

        const snapshots = targets.map(i => {
            const src = frames[i].canvas;
            const nc = document.createElement('canvas');
            nc.width = src.width; nc.height = src.height;
            nc.getContext('2d').drawImage(src, 0, 0);
            return nc;
        });

        const exec = () => {
            targets.forEach(i => {
                const c = frames[i].canvas;
                const ctx = c.getContext('2d');
                const id = ctx.getImageData(0, 0, c.width, c.height);
                const d = id.data;
                for (let p = 0; p < d.length; p += 4) {
                    const dr = d[p] - r, dg = d[p + 1] - g, db = d[p + 2] - b;
                    if (Math.sqrt(dr * dr + dg * dg + db * db) <= threshold) d[p + 3] = 0;
                }
                ctx.putImageData(id, 0, 0);
            });
            renderFrameStrip(); renderPreview();
        };
        const undo = () => {
            targets.forEach((i, j) => {
                const c = frames[i].canvas;
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, c.width, c.height);
                ctx.drawImage(snapshots[j], 0, 0);
            });
            renderFrameStrip(); renderPreview();
        };
        pushCmd({ exec, undo });
        exec();

        btn1.disabled = false;
        btn2.disabled = false;
        status.textContent = '✅ 已完成（套用 ' + targets.length + ' 幀）';
    }, 30);
}

// ── Output size ────────────────────────────────────
function resetOutputSize() {
    document.getElementById('outWidth').value  = gifWidth;
    document.getElementById('outHeight').value = gifHeight;
}

// ── Export GIF ─────────────────────────────────────
function hasAnyTransparency() {
    for (const f of frames) {
        const d = f.canvas.getContext('2d').getImageData(0, 0, f.canvas.width, f.canvas.height).data;
        for (let i = 3; i < d.length; i += 4) if (d[i] < 128) return true;
    }
    return false;
}

function findSafeTransColor() {
    const candidates = [
        0x010203, 0x0102FE, 0x01FE01, 0xFE0102,
        0xFEFE01, 0xFE01FE, 0x7F007F, 0x007F7F,
        0x7F7F00, 0xFF007F, 0x007FFF, 0x7FFF00
    ];
    const usedColors = new Set();
    for (const f of frames) {
        const d = f.canvas.getContext('2d').getImageData(0, 0, f.canvas.width, f.canvas.height).data;
        for (let i = 0; i < d.length; i += 4)
            if (d[i+3] >= 128) usedColors.add((d[i] << 16) | (d[i+1] << 8) | d[i+2]);
    }
    for (const c of candidates) if (!usedColors.has(c)) return c;
    // 所有候選色均被使用：用 maximin 選距離所有內容色最遠的
    const usedArr = [...usedColors];
    let best = candidates[0], bestD = -1;
    for (const c of candidates) {
        let minD = Infinity;
        for (const u of usedArr) {
            const dr = ((c>>16)&0xff)-((u>>16)&0xff);
            const dg = ((c>>8)&0xff)-((u>>8)&0xff);
            const db = (c&0xff)-(u&0xff);
            const d = dr*dr + dg*dg + db*db;
            if (d < minD) minD = d;
        }
        if (minD > bestD) { bestD = minD; best = c; }
    }
    return best;
}

function exportGIF() {
    const btn = document.querySelector('.btn.success');
    if (btn.disabled) return;
    btn.disabled = true;

    const outW = parseInt(document.getElementById('outWidth').value)  || gifWidth;
    const outH = parseInt(document.getElementById('outHeight').value) || gifHeight;
    const quality = parseInt(document.getElementById('outQuality').value) || 10;
    const prog = document.getElementById('exportProgress');
    prog.textContent = '準備中...';

    const workerBlob = new Blob(
        [document.getElementById('worker-code').textContent],
        { type: 'application/javascript' }
    );
    const workerUrl = URL.createObjectURL(workerBlob);

    const useTransparency = hasAnyTransparency();
    const transColor = useTransparency ? findSafeTransColor() : null;
    const tR = transColor ? (transColor >> 16) & 0xff : 0;
    const tG = transColor ? (transColor >> 8)  & 0xff : 0;
    const tB = transColor ? transColor & 0xff          : 0;

    const gif = new GIF({
        workers: 2, quality, width: outW, height: outH,
        workerScript: workerUrl,
        transparent: transColor
    });

    frames.forEach(f => {
        const tc = document.createElement('canvas');
        tc.width = outW; tc.height = outH;
        const tctx = tc.getContext('2d');
        tctx.drawImage(f.canvas, 0, 0, outW, outH);

        if (useTransparency) {
            const id = tctx.getImageData(0, 0, outW, outH);
            const d = id.data;
            for (let i = 0; i < d.length; i += 4) {
                if (d[i+3] < 128) {
                    d[i] = tR; d[i+1] = tG; d[i+2] = tB; d[i+3] = 255;
                }
            }
            tctx.putImageData(id, 0, 0);
        }

        gif.addFrame(tctx, { delay: f.delay, copy: true });
    });

    gif.on('progress', p => { prog.textContent = '匯出中... ' + Math.round(p * 100) + '%'; });
    gif.on('finished', blob => {
        URL.revokeObjectURL(workerUrl);
        btn.disabled = false;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'edited.gif';
        link.click();
        prog.textContent = '✅ 匯出完成！';
    });
    gif.on('error', err => {
        URL.revokeObjectURL(workerUrl);
        btn.disabled = false;
        prog.textContent = '❌ 匯出失敗：' + (err || '未知錯誤');
    });

    gif.render();
}

// ── Frame Manager Modal ────────────────────────────
let fmSelected = new Set();
let fmLastClick = -1;
let fmDragSrc = -1;

function openFrameManager() {
    fmSelected.clear();
    fmLastClick = -1;
    renderFmGrid();
    document.getElementById('fmOverlay').classList.add('open');
}
function closeFrameManager() {
    document.getElementById('fmOverlay').classList.remove('open');
    renderFrameStrip();
    renderPreview();
}
function fmOverlayClick(e) {
    if (e.target === document.getElementById('fmOverlay')) closeFrameManager();
}

function renderFmGrid() {
    const grid = document.getElementById('fmGrid');
    grid.innerHTML = '';
    const THUMB = 80;
    frames.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'fm-item' + (fmSelected.has(i) ? ' fm-selected' : '');
        div.dataset.index = i;

        const check = document.createElement('div');
        check.className = 'fm-check';
        check.textContent = '✓';

        const th = document.createElement('canvas');
        const ratio = f.canvas.height / f.canvas.width;
        th.width  = THUMB;
        th.height = Math.round(THUMB * ratio);
        th.getContext('2d').drawImage(f.canvas, 0, 0, th.width, th.height);

        const lbl = document.createElement('div');
        lbl.className = 'fm-lbl';
        lbl.textContent = '#' + (i + 1) + ' · ' + f.delay + 'ms';

        div.appendChild(check);
        div.appendChild(th);
        div.appendChild(lbl);
        div.addEventListener('click', e => fmItemClick(i, e));

        div.draggable = true;
        div.addEventListener('dragstart', e => {
            if (!fmSelected.has(i)) { fmSelected.clear(); fmSelected.add(i); renderFmGrid(); }
            fmDragSrc = i;
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => div.classList.add('fm-dragging'), 0);
        });
        div.addEventListener('dragend', () => {
            grid.querySelectorAll('.fm-dragging,.fm-drop-target').forEach(el => {
                el.classList.remove('fm-dragging', 'fm-drop-target');
            });
        });
        div.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (fmSelected.has(i)) return;
            grid.querySelectorAll('.fm-drop-target').forEach(el => el.classList.remove('fm-drop-target'));
            div.classList.add('fm-drop-target');
        });
        div.addEventListener('dragleave', () => div.classList.remove('fm-drop-target'));
        div.addEventListener('drop', e => {
            e.preventDefault();
            div.classList.remove('fm-drop-target');
            if (fmDragSrc === i || fmSelected.has(i)) return;
            fmMoveSelectedTo(i);
        });

        grid.appendChild(div);
    });
    updateFmInfo();
}

function fmItemClick(i, e) {
    if (e.shiftKey && fmLastClick >= 0) {
        const lo = Math.min(fmLastClick, i);
        const hi = Math.max(fmLastClick, i);
        for (let j = lo; j <= hi; j++) fmSelected.add(j);
    } else {
        fmSelected.has(i) ? fmSelected.delete(i) : fmSelected.add(i);
        fmLastClick = i;
    }
    renderFmGrid();
}

function fmSelectAll()  { frames.forEach((_, i) => fmSelected.add(i)); renderFmGrid(); }
function fmSelectNone() { fmSelected.clear(); renderFmGrid(); }
function fmInvert()     { frames.forEach((_, i) => fmSelected.has(i) ? fmSelected.delete(i) : fmSelected.add(i)); renderFmGrid(); }

function updateFmInfo() {
    document.getElementById('fmSelInfo').textContent = '已選 ' + fmSelected.size + ' / ' + frames.length + ' 幀';
}

function fmDeleteSelected() {
    if (!fmSelected.size) return;
    if (frames.length - fmSelected.size < 1) { alert('至少保留一幀'); return; }
    const saved = [...fmSelected].sort((a, b) => a - b).map(i => ({ idx: i, frame: frames[i] }));
    const exec = () => {
        [...fmSelected].sort((a, b) => b - a).forEach(i => frames.splice(i, 1));
        fmSelected.clear(); fmLastClick = -1;
        if (selectedIndex >= frames.length) selectedIndex = frames.length - 1;
        renderFmGrid(); renderFrameStrip();
    };
    pushCmd({ exec, undo() {
        saved.forEach(({ idx, frame }) => frames.splice(idx, 0, frame));
        renderFmGrid(); renderFrameStrip(); renderPreview();
    }});
    exec();
}

function fmDuplicateSelected() {
    if (!fmSelected.size) return;
    const indices = [...fmSelected].sort((a, b) => a - b);
    const newFrames = [];
    let offset = 0;
    const exec = () => {
        offset = 0; newFrames.length = 0;
        indices.forEach(i => {
            const nf = cloneFrame(frames[i + offset]);
            frames.splice(i + offset + 1, 0, nf);
            newFrames.push(i + offset + 1);
            offset++;
        });
        fmSelected.clear(); renderFmGrid();
    };
    pushCmd({ exec, undo() {
        [...newFrames].sort((a, b) => b - a).forEach(i => frames.splice(i, 1));
        renderFmGrid(); renderFrameStrip();
    }});
    exec();
}

function fmApplyDelay() {
    if (!fmSelected.size) return;
    const ms = Math.max(1, parseInt(document.getElementById('fmDelay').value) || 100);
    const targets = [...fmSelected];
    const oldDelays = targets.map(i => frames[i].delay);
    const exec = () => { targets.forEach(i => frames[i].delay = ms); renderFmGrid(); };
    pushCmd({ exec, undo() { targets.forEach((i, j) => frames[i].delay = oldDelays[j]); renderFmGrid(); } });
    exec();
}

function fmShiftDelay() {
    const delta = parseInt(document.getElementById('fmShiftSign').value) * (Math.max(1, parseInt(document.getElementById('fmShiftAmt').value) || 10));
    const targets = fmSelected.size ? [...fmSelected] : frames.map((_, i) => i);
    const oldDelays = targets.map(i => frames[i].delay);
    const exec = () => {
        targets.forEach(i => frames[i].delay = Math.max(1, frames[i].delay + delta));
        renderFmGrid();
    };
    pushCmd({ exec, undo() { targets.forEach((i, j) => frames[i].delay = oldDelays[j]); renderFmGrid(); } });
    exec();
}

// ── Minimal ZIP (stored, no compression) ───────────
const _crcTable = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
        t[i] = c;
    }
    return t;
})();
function _crc32(data) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) c = _crcTable[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
}
function _makeZip(files) {
    const enc = new TextEncoder();
    const parts = [], meta = [];
    let offset = 0;
    for (const { name, data } of files) {
        const nb = enc.encode(name), crc = _crc32(data), sz = data.length;
        const lh = new DataView(new ArrayBuffer(30 + nb.length));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
        lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
        lh.setUint16(26, nb.length, true);
        new Uint8Array(lh.buffer).set(nb, 30);
        meta.push({ offset, crc, sz, nb });
        parts.push(new Uint8Array(lh.buffer)); parts.push(data);
        offset += 30 + nb.length + sz;
    }
    const cdStart = offset;
    for (const { offset: o, crc, sz, nb } of meta) {
        const cd = new DataView(new ArrayBuffer(46 + nb.length));
        cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
        cd.setUint32(16, crc, true); cd.setUint32(20, sz, true); cd.setUint32(24, sz, true);
        cd.setUint16(28, nb.length, true); cd.setUint32(42, o, true);
        new Uint8Array(cd.buffer).set(nb, 46);
        parts.push(new Uint8Array(cd.buffer));
        offset += 46 + nb.length;
    }
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, offset - cdStart, true); eocd.setUint32(16, cdStart, true);
    parts.push(new Uint8Array(eocd.buffer));
    const out = new Uint8Array(parts.reduce((s, p) => s + p.length, 0));
    let pos = 0; for (const p of parts) { out.set(p, pos); pos += p.length; }
    return out;
}
function _canvasToPngBytes(canvas) {
    const b64 = canvas.toDataURL('image/png').split(',')[1];
    const bin = atob(b64);
    const d = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) d[i] = bin.charCodeAt(i);
    return d;
}

// ── FM Download / Insert ────────────────────────────
function fmDownloadSelected() {
    if (!fmSelected.size) return;
    const indices = [...fmSelected].sort((a, b) => a - b);
    if (indices.length === 1) { downloadFrame(indices[0]); return; }
    const files = indices.map(i => ({
        name: 'frame_' + String(i + 1).padStart(3, '0') + '.png',
        data: _canvasToPngBytes(frames[i].canvas)
    }));
    const blob = new Blob([_makeZip(files)], { type: 'application/zip' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'frames.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function fmInsertImages() {
    const input = document.createElement('input');
    input.type = 'file'; input.multiple = true;
    input.accept = 'image/png,image/jpeg,image/webp';
    input.onchange = () => {
        const sorted = [...input.files].sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
        if (!sorted.length) return;
        const insertAt = fmSelected.size > 0 ? Math.max(...fmSelected) + 1 : frames.length;
        Promise.all(sorted.map(file => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = img.width; c.height = img.height;
                c.getContext('2d').drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                resolve({ canvas: c, delay: 100 });
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
            img.src = url;
        }))).then(newFrames => {
            const exec = () => {
                frames.splice(insertAt, 0, ...newFrames);
                fmSelected.clear();
                newFrames.forEach((_, j) => fmSelected.add(insertAt + j));
                renderFmGrid(); renderFrameStrip();
            };
            pushCmd({ exec, undo() {
                frames.splice(insertAt, newFrames.length);
                fmSelected.clear(); renderFmGrid(); renderFrameStrip();
            }});
            exec();
        }).catch(err => {
            alert('圖片載入失敗：' + err.message);
        });
    };
    input.click();
}

function fmMoveSelectedTo(target) {
    const selected = [...fmSelected].sort((a, b) => a - b);
    if (!selected.length || fmSelected.has(target)) return;

    const snapshot = [...frames];
    const snapSel  = new Set(fmSelected);

    const exec = () => {
        const moved = selected.map(i => frames[i]);
        const beforeTarget = selected.filter(i => i < target).length;
        const insertAt = target - beforeTarget;
        [...selected].reverse().forEach(i => frames.splice(i, 1));
        frames.splice(insertAt, 0, ...moved);
        fmSelected.clear();
        moved.forEach((_, j) => fmSelected.add(insertAt + j));
        renderFmGrid(); renderFrameStrip();
    };
    pushCmd({ exec, undo() {
        frames.length = 0; frames.push(...snapshot);
        fmSelected.clear(); snapSel.forEach(i => fmSelected.add(i));
        renderFmGrid(); renderFrameStrip();
    }});
    exec();
}

function fmMoveSelected(dir) {
    if (!fmSelected.size) return;
    const indices = [...fmSelected].sort((a, b) => dir < 0 ? a - b : b - a);
    // 邊界檢查：前移時最小索引不能為 0，後移時最大索引不能為末尾
    if (dir < 0 && Math.min(...indices) === 0) return;
    if (dir > 0 && Math.max(...indices) === frames.length - 1) return;

    const exec = () => {
        indices.forEach(i => {
            const to = i + dir;
            const [f] = frames.splice(i, 1);
            frames.splice(to, 0, f);
        });
        fmSelected.clear();
        indices.forEach(i => fmSelected.add(i + dir));
        renderFmGrid(); renderFrameStrip();
    };
    pushCmd({ exec, undo() {
        [...indices].sort((a, b) => dir < 0 ? b - a : a - b).forEach(i => {
            const to = i + dir;
            const [f] = frames.splice(to, 1);
            frames.splice(i, 0, f);
        });
        fmSelected.clear();
        indices.forEach(i => fmSelected.add(i));
        renderFmGrid(); renderFrameStrip();
    }});
    exec();
}

function fmInsertGIF() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/gif';
    input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
            const buf = await file.arrayBuffer();
            const gr = new GifReader(new Uint8Array(buf));
            const W = gr.width, H = gr.height;
            const srcW = gifWidth, srcH = gifHeight;

            // 解碼所有幀
            const compositePixels = new Uint8ClampedArray(W * H * 4);
            const savedPixels     = new Uint8ClampedArray(W * H * 4);
            const rawFrames = [];
            for (let i = 0; i < gr.numFrames(); i++) {
                const info = gr.frameInfo(i);
                if (i > 0) {
                    const prev = gr.frameInfo(i - 1);
                    if (prev.disposal === 2) {
                        for (let py = prev.y; py < prev.y + prev.height; py++) {
                            const s = (py * W + prev.x) * 4;
                            compositePixels.fill(0, s, s + prev.width * 4);
                        }
                    } else if (prev.disposal === 3) {
                        compositePixels.set(savedPixels);
                    }
                }
                if (info.disposal === 3) savedPixels.set(compositePixels);
                gr.decodeAndBlitFrameRGBA(i, compositePixels);
                const c = document.createElement('canvas');
                c.width = W; c.height = H;
                c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(compositePixels), W, H), 0, 0);
                rawFrames.push({ canvas: c, delay: Math.max((info.delay || 10) * 10, 1) });
            }

            // 尺寸相同直接插入
            let newFrames;
            if (W === srcW && H === srcH) {
                newFrames = rawFrames;
            } else {
                const choice = await _showDimDialog(W, H, srcW, srcH);
                if (choice === null) return;
                newFrames = rawFrames.map(f => {
                    const c = document.createElement('canvas');
                    c.width = srcW; c.height = srcH;
                    const ctx = c.getContext('2d');
                    if (choice === 'stretch') {
                        ctx.drawImage(f.canvas, 0, 0, srcW, srcH);
                    } else if (choice === 'fit') {
                        const scale = Math.min(srcW / W, srcH / H);
                        const dw = Math.round(W * scale), dh = Math.round(H * scale);
                        const dx = Math.round((srcW - dw) / 2), dy = Math.round((srcH - dh) / 2);
                        ctx.drawImage(f.canvas, dx, dy, dw, dh);
                    } else { // crop
                        const scale = Math.max(srcW / W, srcH / H);
                        const dw = Math.round(W * scale), dh = Math.round(H * scale);
                        const dx = Math.round((srcW - dw) / 2), dy = Math.round((srcH - dh) / 2);
                        ctx.drawImage(f.canvas, dx, dy, dw, dh);
                    }
                    return { canvas: c, delay: f.delay };
                });
            }

            const insertAt = fmSelected.size > 0 ? Math.max(...fmSelected) + 1 : frames.length;
            const exec = () => {
                frames.splice(insertAt, 0, ...newFrames);
                fmSelected.clear();
                newFrames.forEach((_, j) => fmSelected.add(insertAt + j));
                renderFmGrid(); renderFrameStrip();
            };
            pushCmd({ exec, undo() {
                frames.splice(insertAt, newFrames.length);
                fmSelected.clear(); renderFmGrid(); renderFrameStrip();
            }});
            exec();
        } catch (err) {
            alert('GIF 載入失敗：' + (err.message || err));
        }
    };
    input.click();
}

function _showDimDialog(srcW, srcH, dstW, dstH) {
    return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999';
        overlay.innerHTML = `
          <div style="background:#1e1e2e;border:1px solid #555;border-radius:10px;padding:24px 28px;max-width:360px;color:#eee;font-family:inherit">
            <div style="margin-bottom:12px;font-size:.95rem">
              插入的 GIF 尺寸（${srcW}×${srcH}）與當前（${dstW}×${dstH}）不同，請選擇處理方式：
            </div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <button data-v="stretch" style="padding:8px;border-radius:6px;border:1px solid #666;background:#2a2a3e;color:#eee;cursor:pointer">縮放至當前尺寸（拉伸填滿）</button>
              <button data-v="fit"     style="padding:8px;border-radius:6px;border:1px solid #666;background:#2a2a3e;color:#eee;cursor:pointer">等比縮放＋補透明</button>
              <button data-v="crop"    style="padding:8px;border-radius:6px;border:1px solid #666;background:#2a2a3e;color:#eee;cursor:pointer">等比縮放＋置中裁切</button>
              <button data-v="cancel"  style="padding:8px;border-radius:6px;border:1px solid #444;background:#111;color:#aaa;cursor:pointer">取消</button>
            </div>
          </div>`;
        overlay.querySelectorAll('button').forEach(btn => {
            btn.onclick = () => {
                document.body.removeChild(overlay);
                resolve(btn.dataset.v === 'cancel' ? null : btn.dataset.v);
            };
        });
        document.body.appendChild(overlay);
    });
}

// ── Helpers ────────────────────────────────────────
function updateLabel(inputId, labelId) {
    document.getElementById(labelId).textContent = document.getElementById(inputId).value;
}
